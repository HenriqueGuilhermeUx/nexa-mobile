name: Nexa Global Sync Privy Web Lock

on:
  push:
    branches:
      - feat/nexa-global-v1
    paths:
      - '.github/workflows/nexa-global-sync-privy-web-lock.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/nexa-global-v1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm install --include=dev --no-audit --no-fund
      - run: |
          set -euo pipefail
          git diff -- package.json package-lock.json
          if git diff --quiet -- package.json package-lock.json; then
            echo "Lockfile already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build(global): lock Privy React web SDK"
          git push origin HEAD:feat/nexa-global-v1
