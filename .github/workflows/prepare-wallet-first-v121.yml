name: Prepare Wallet-First v121

on:
  push:
    branches:
      - release/wallet-first-v121
    paths:
      - 'scripts/bump-wallet-first-v121.js'
      - '.github/workflows/prepare-wallet-first-v121.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/wallet-first-v121
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Align v121 files
        run: node scripts/bump-wallet-first-v121.js
      - name: Commit aligned release files
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Release files already aligned.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate-mobile-safety.js scripts/validate-biometric-app-lock.js .github/workflows/wallet-first-pilot-apk.yml
          git commit -m 'Align v121 release safety contracts'
          git push origin HEAD:release/wallet-first-v121
