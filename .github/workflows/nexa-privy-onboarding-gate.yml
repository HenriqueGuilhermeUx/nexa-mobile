name: Nexa real Privy onboarding gate
on:
  pull_request:
    paths:
      - 'src/lib/onboarding.ts'
      - 'app/onboarding-wallet.tsx'
      - 'scripts/validate-privy-onboarding-link.cjs'
      - '.github/workflows/nexa-privy-onboarding-gate.yml'
permissions:
  contents: read
jobs:
  test-onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: node scripts/validate-privy-onboarding-link.cjs
