name: Build Nexa Android 1.4.8

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/build-triggers/android-1.4.8.txt

permissions:
  contents: read

concurrency:
  group: nexa-android-production-1.4.8
  cancel-in-progress: false

jobs:
  build-android:
    name: Build signed Android AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: nexa-mobile/nexa-mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.19.4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Expo authentication secret
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Repository secret EXPO_TOKEN is required."
            exit 1
          fi

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate secure Privy contract
        run: node scripts/validate-privy-mobile.js

      - name: Resolve Expo 54 compatible versions
        run: npx expo install --fix --npm

      - name: Validate Expo project
        run: npx expo-doctor

      - name: Export Android JavaScript bundle
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/nexa-dist-check"

      - name: Build signed production AAB locally
        id: local_build
        continue-on-error: true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_TELEMETRY: '1'
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
          EAS_LOCAL_BUILD_SKIP_CLEANUP: '1'
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/nexa-eas-local
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/nexa-mobile/nexa-mobile/local-build-artifacts
        run: |
          eas build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output "$GITHUB_WORKSPACE/nexa-mobile/nexa-mobile/Nexa-1.4.8-android-v28.aab"

      - name: Upload local build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-1.4.8-local-build-diagnostics
          path: |
            ${{ runner.temp }}/nexa-eas-local/logs
            nexa-mobile/nexa-mobile/local-build-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Fail when local build fails
        if: steps.local_build.outcome == 'failure'
        run: exit 1

      - name: Create release metadata
        run: |
          test -s Nexa-1.4.8-android-v28.aab
          sha256sum Nexa-1.4.8-android-v28.aab > SHA256SUMS.txt
          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync(
            'build-metadata.json',
            JSON.stringify(
              {
                product: 'Nexa',
                version: '1.4.8',
                androidVersionCode: 28,
                package: 'br.com.trynexa.app',
                profile: 'production',
                buildMode: 'eas-local-on-github-actions',
                gitCommit: process.env.GITHUB_SHA,
                financialExecutionEnabled: false,
                createdAt: new Date().toISOString(),
              },
              null,
              2,
            ) + '\n',
          );
          NODE

      - name: Upload Google Play artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-1.4.8-Android-v28-Google-Play
          path: |
            nexa-mobile/nexa-mobile/Nexa-1.4.8-android-v28.aab
            nexa-mobile/nexa-mobile/SHA256SUMS.txt
            nexa-mobile/nexa-mobile/build-metadata.json
          if-no-files-found: error
          retention-days: 30
