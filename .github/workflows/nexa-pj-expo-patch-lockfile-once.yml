name: Nexa PJ Expo patch lockfile (draft branch only)
on:
  push:
    branches:
      - feat/pf-pj-single-app-entry-20261020
    paths:
      - .github/workflows/nexa-pj-expo-patch-lockfile-once.yml
permissions:
  contents: write
jobs:
  lockfile:
    if: startsWith(github.event.head_commit.message, 'ci(nexa-pj): one-time Expo patch lockfile job')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feat/pf-pj-single-app-entry-20261020
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Update only the two Expo SDK 57 patch dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund 'expo-crypto@~57.0.4' 'expo-dev-client@~57.0.20'
          node -e "const p=require('./package.json'); if(p.dependencies['expo-crypto']!=='~57.0.4'||p.dependencies['expo-dev-client']!=='~57.0.20')process.exit(1)"
          npm ci --ignore-scripts --no-audit --no-fund
          npx expo-doctor
      - name: Commit dependency-only changes to the isolated PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'fix(nexa-pj): align Expo SDK 57 crypto and dev-client patch versions'
          git push origin HEAD:feat/pf-pj-single-app-entry-20261020
