name: Nexa v143 Wallet 2026 Design OTA

on:
  push:
    branches:
      - main
    paths:
      - '.github/build-triggers/v143-wallet-2026-design-ota.txt'
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      - '.github/build-triggers/v143-wallet-2026-design-ota.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexa-v143-wallet-2026-design-ota
  cancel-in-progress: true

jobs:
  publish:
    name: Validate and publish v143 Wallet 2026 OTA
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_NEXA_API_URL: https://nexa-backend-p2u0.onrender.com/api/v1
      EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_API_URL: https://nexa-backend-p2u0.onrender.com/api/v1
      EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED: 'true'
      EXPO_PUBLIC_NEXA_ASSISTANT_ENABLED: 'true'
      EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_ENABLED: 'true'
      EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_RECURRING_ENABLED: 'true'
      EXPO_PUBLIC_NEXA_RELEASE_CHANNEL: production-safe-preview

    steps:
      - name: Checkout v143
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Set up Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: 24.8.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Verify v143 OTA compatibility boundary
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const app = require('./app.json').expo;
          const dynamic = require('./app.config.js')({ config: app });
          const pkg = require('./package.json');
          const eas = require('./eas.json');
          const profile = eas?.build?.['production-safe-preview'];

          if (app.version !== '2.0.40' || pkg.version !== '2.0.40') {
            throw new Error('Unexpected app/package version');
          }
          if (Number(app.android?.versionCode) !== 143 || String(app.ios?.buildNumber) !== '143') {
            throw new Error('Unexpected v143 native identity');
          }
          if (dynamic.version !== '2.0.40' || Number(dynamic.android?.versionCode) !== 143) {
            throw new Error('Dynamic config identity mismatch');
          }
          if (app.runtimeVersion?.policy !== 'appVersion') {
            throw new Error('runtimeVersion appVersion policy missing');
          }
          if (app.updates?.url !== 'https://u.expo.dev/b3faabec-283a-4ba2-88b5-f096304e68aa') {
            throw new Error('Unexpected EAS Update URL');
          }
          if (profile?.channel !== 'production-safe-preview') {
            throw new Error('v143 Live Test channel mismatch');
          }
          if (profile?.env?.EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED !== 'true') {
            throw new Error('v143 Live Test execution boundary mismatch');
          }

          const shell = fs.readFileSync('src/components/AlignedLegacyApp.tsx', 'utf8');
          for (const required of [
            'NEXA WALLET',
            'VALOR DA CARTEIRA',
            'Movimentações recentes',
            "['move', 'move', 'Movimentar']",
            'bottomCenterIcon',
            'profileResourceGrid',
          ]) {
            if (!shell.includes(required)) throw new Error('Missing Wallet 2026 contract: ' + required);
          }
          const theme = fs.readFileSync('src/theme.ts', 'utf8');
          if (!theme.includes("background: '#06111F'") || !theme.includes("cyan: '#31D7FF'")) {
            throw new Error('Wallet 2026 theme tokens missing');
          }
          console.log('OTA boundary OK: runtime 2.0.40 / Android v143 / Wallet 2026 JS-only update.');
          NODE

      - name: Validate Wallet-First safety contracts
        run: |
          set -euo pipefail
          npm run typecheck
          node scripts/validate-mobile-safety-v123.js
          node scripts/validate-wallet-first-exit-quote.js
          node scripts/validate-wallet-first-exit-flow.js
          node scripts/validate-wallet-first-user-actions.js
          node scripts/validate-wallet-cross-device-recovery.js
          node scripts/validate-biometric-app-lock.js

      - name: Authenticate Expo
        run: eas whoami

      - name: Publish Wallet 2026 OTA to installed v143 Live Test
        run: |
          set -euo pipefail
          eas update \
            --channel production-safe-preview \
            --platform android \
            --message "v143 Wallet 2026 redesign: navy cyan silver, wallet-first home and navigation" \
            --clear-cache \
            --non-interactive

      - name: Confirm publish completed
        run: echo 'Nexa v143 Wallet 2026 OTA published to production-safe-preview.'
