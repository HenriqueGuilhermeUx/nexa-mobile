name: Nexa Maya v148 OTA - preserve activation
on:
  push:
    branches: [feat/maya-v148-ota-compatible-20261104]
    paths: ['.github/workflows/maya-v148-production-ota.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexa-activation-ota-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_NEXA_API_URL: https://nexa-backend-p2u0.onrender.com/api/v1
      EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_API_URL: https://nexa-backend-p2u0.onrender.com/api/v1
      EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED: 'true'
      EXPO_PUBLIC_NEXA_ASSISTANT_ENABLED: 'true'
      EXPO_PUBLIC_NEXA_MAYA_PREMIUM_ENABLED: 'false'
      EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_ENABLED: 'true'
      EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_RECURRING_ENABLED: 'true'
      EXPO_PUBLIC_NEXA_RELEASE_CHANNEL: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/aave-v148-internal-apk-20261102
          fetch-depth: 0
      - name: Preserve prior activation OTA and add Maya-only UI
        run: |
          git fetch origin main feat/maya-v148-ota-compatible-20261104 --depth=1
          git show origin/main:app/index.tsx > app/index.tsx
          git show origin/main:app/kyc.tsx > app/kyc.tsx
          git show origin/feat/maya-v148-ota-compatible-20261104:app/assistant.tsx > app/assistant.tsx
          git show origin/feat/maya-v148-ota-compatible-20261104:app/_layout.tsx > app/_layout.tsx
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: node scripts/validate-mobile-safety-v123.js
      - name: Validate v148 target and Maya scope
        run: |
          node <<'NODE'
          const fs=require('fs');
          const app=JSON.parse(fs.readFileSync('app.json','utf8')).expo;
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const eas=JSON.parse(fs.readFileSync('eas.json','utf8'));
          const dynamic=require('./app.config.js')({config:app});
          if(app.version!=='2.0.43'||app.android.versionCode!==148||pkg.version!=='2.0.43')throw Error('Wrong v148 baseline');
          if(dynamic.version!=='2.0.43'||dynamic.android.versionCode!==148)throw Error('Wrong dynamic config');
          if(app.runtimeVersion?.policy!=='appVersion'||eas.build.production.channel!=='production')throw Error('Wrong OTA channel');
          if(app.android.package!=='br.com.trynexa.app')throw Error('Wrong app');
          if(!fs.readFileSync('app/index.tsx','utf8').includes('sem precisar depositar agora'))throw Error('Prior activation copy missing');
          if(!fs.readFileSync('app/assistant.tsx','utf8').includes('Sua assistente inteligente'))throw Error('Maya identity missing');
          if(process.env.EXPO_PUBLIC_NEXA_MAYA_PREMIUM_ENABLED!=='false')throw Error('Premium must remain disabled');
          NODE
      - name: Only approved UI files may change
        run: |
          git diff --name-only | sort > /tmp/changed-files
          printf 'app/_layout.tsx\napp/assistant.tsx\napp/index.tsx\napp/kyc.tsx\n' | sort > /tmp/allowed-files
          diff -u /tmp/allowed-files /tmp/changed-files
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 24.8.0
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas whoami
      - name: Publish Maya UI preserving activation copy
        run: eas update --channel production --platform android --message "Nexa 2.0.43 Maya assistant and activation guidance" --non-interactive
