name: Nexa Open Finance Official Pilot APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nexa-assistant-open-finance-release
    paths:
      - '.github/workflows/assistant-open-finance-pilot-apk.yml'
      - 'app.config.js'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - 'app/**'
      - 'src/**'

permissions:
  contents: read
  statuses: write

concurrency:
  group: nexa-open-finance-official-pilot-apk
  cancel-in-progress: true

jobs:
  build:
    name: Signed Open Finance official pilot APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout pilot branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || (echo 'EXPO_TOKEN ausente' && exit 1)
          eas whoami

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve release identity
        run: |
          set -euo pipefail
          APP_VERSION=$(node -e "const f=require('./app.config.js'); const c=f({config:{}}); process.stdout.write(String(c.version));")
          APP_BUILD=$(node -e "const f=require('./app.config.js'); const c=f({config:{}}); process.stdout.write(String(c.android.versionCode));")
          test -n "$APP_VERSION"
          test -n "$APP_BUILD"
          echo "EXPECTED_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "EXPECTED_BUILD=$APP_BUILD" >> "$GITHUB_ENV"
          echo "Resolved Nexa release: $APP_VERSION / v$APP_BUILD"

      - name: Assert official Open Finance boundary
        run: |
          set -euo pipefail
          node <<'NODE'
          const eas = require('./eas.json');
          const p = eas?.build?.['open-finance-pilot'];
          const official = 'https://nexa-backend-p2u0.onrender.com/api/v1';
          if (!p) throw new Error('open-finance-pilot profile missing');
          if (p.android?.buildType !== 'apk') throw new Error('Pilot must build APK');
          if (p.env?.EXPO_PUBLIC_NEXA_API_URL !== official) throw new Error('Main API mismatch');
          if (p.env?.EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_API_URL !== official) {
            throw new Error('Open Finance must use the official Nexa backend');
          }
          if (p.env?.EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED !== 'false') {
            throw new Error('Financial execution must remain OFF');
          }
          if (p.env?.EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_ENABLED !== 'true') {
            throw new Error('Open Finance UI must be ON');
          }
          if (p.env?.EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_RECURRING_ENABLED !== 'false') {
            throw new Error('Recurring Open Finance must remain OFF');
          }
          console.log('Official Nexa Open Finance boundary OK.');
          NODE

      - name: Preflight official Nexa backend
        run: |
          set -euo pipefail
          API='https://nexa-backend-p2u0.onrender.com/api/v1'
          curl --fail --silent --show-error --retry 8 --retry-delay 10 --max-time 20 "$API/health" -o nexa-health.json
          node <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('nexa-health.json', 'utf8'));
          if (String(health.status || '').toLowerCase() !== 'ok') {
            throw new Error('Official Nexa backend is not healthy');
          }
          console.log('Official Nexa backend health OK.');
          NODE

      - name: Assert Open Finance mobile contracts
        run: |
          set -euo pipefail
          test -f app/open-finance.tsx
          test -f src/lib/efiOpenFinance.ts
          grep -q 'latestDeposit' src/lib/efiOpenFinance.ts
          grep -q 'deposit/latest' src/lib/efiOpenFinance.ts
          if grep -R --line-number --fixed-strings 'https://nexa-open-finance-homolog.onrender.com' eas.json app src; then
            echo 'Legacy Open Finance backend reference detected in runtime configuration.'
            exit 1
          fi
          echo 'Open Finance mobile contracts OK.'

      - name: Validate safety contracts
        run: node scripts/validate-mobile-safety.js

      - name: Validate release assets
        run: node scripts/validate-release-assets.js

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Build signed official pilot APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: 'true'
          NODE_ENV: 'production'
          EXPO_NO_TELEMETRY: '1'
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
          EAS_LOCAL_BUILD_SKIP_CLEANUP: '1'
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/nexa-open-finance-official
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/local-build-artifacts-open-finance
        run: |
          set -euo pipefail
          FILE="Nexa-Open-Finance-Official-${EXPECTED_VERSION}-v${EXPECTED_BUILD}.apk"
          rm -f "$FILE"
          eas build --platform android --profile open-finance-pilot --local --non-interactive --output "$GITHUB_WORKSPACE/$FILE"
          test -s "$FILE"
          SHA256=$(sha256sum "$FILE" | awk '{print $1}')
          echo "apk_file=$FILE" >> "$GITHUB_ENV"
          echo "apk_sha256=$SHA256" >> "$GITHUB_ENV"
          printf '%s  %s\n' "$SHA256" "$FILE" > SHA256SUMS.txt
          ls -lh "$FILE"

      - name: Verify signed APK identity
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$APKSIGNER"
          test -x "$APKANALYZER"
          "$APKSIGNER" verify --verbose --print-certs "${{ env.apk_file }}" > apk-signature.txt
          "$APKANALYZER" manifest application-id "${{ env.apk_file }}" | tee apk-package.txt
          "$APKANALYZER" manifest version-name "${{ env.apk_file }}" | tee apk-version-name.txt
          "$APKANALYZER" manifest version-code "${{ env.apk_file }}" | tee apk-version-code.txt
          "$APKANALYZER" manifest target-sdk "${{ env.apk_file }}" | tee apk-target-sdk.txt
          grep -qx 'br.com.trynexa.app' apk-package.txt
          grep -Fqx "$EXPECTED_VERSION" apk-version-name.txt
          grep -Fqx "$EXPECTED_BUILD" apk-version-code.txt
          grep -qx '36' apk-target-sdk.txt
          echo "APK VERIFIED: Nexa ${EXPECTED_VERSION} v${EXPECTED_BUILD}, official Open Finance backend."

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-Open-Finance-Official-VERIFIED
          path: |
            ${{ env.apk_file }}
            SHA256SUMS.txt
            apk-signature.txt
            apk-package.txt
            apk-version-name.txt
            apk-version-code.txt
            apk-target-sdk.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-Open-Finance-Official-build-diagnostics
          path: |
            ${{ runner.temp }}/nexa-open-finance-official/logs
            local-build-artifacts-open-finance
          if-no-files-found: warn
          retention-days: 14
