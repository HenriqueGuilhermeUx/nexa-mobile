name: Nexa Assistant + Open Finance Pilot AAB

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nexa-assistant-open-finance-release
    paths:
      - '.github/workflows/assistant-open-finance-pilot-aab.yml'
      - 'eas.json'
      - 'app.config.js'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'app/**'
      - 'src/**'

permissions:
  contents: read
  statuses: write

concurrency:
  group: nexa-assistant-open-finance-pilot-aab
  cancel-in-progress: true

jobs:
  build:
    name: Signed Assistant + Open Finance pilot AAB
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout integrated release branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || (echo 'EXPO_TOKEN ausente' && exit 1)
          eas whoami

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve release identity
        run: |
          set -euo pipefail
          APP_VERSION=$(node -e "const f=require('./app.config.js'); const c=f({config:{}}); process.stdout.write(String(c.version));")
          APP_BUILD=$(node -e "const f=require('./app.config.js'); const c=f({config:{}}); process.stdout.write(String(c.android.versionCode));")
          test -n "$APP_VERSION"
          test -n "$APP_BUILD"
          echo "EXPECTED_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "EXPECTED_BUILD=$APP_BUILD" >> "$GITHUB_ENV"
          echo "Resolved Nexa release: $APP_VERSION / v$APP_BUILD"

      - name: Preflight Nexa and Open Finance backends
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 10 --max-time 20 \
            'https://nexa-backend-p2u0.onrender.com/api/v1/health' -o nexa-health.json
          curl --fail --silent --show-error --retry 8 --retry-delay 10 --max-time 20 \
            'https://nexa-backend-p2u0.onrender.com/api/v1/health' -o of-health.json
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['nexa-health.json', 'of-health.json']) {
            const health = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (String(health.status || '').toLowerCase() !== 'ok') {
              throw new Error(`${file} is not healthy`);
            }
          }
          console.log('Nexa + Open Finance health OK.');
          NODE

      - name: Assert integrated AAB profile
        run: |
          set -euo pipefail
          node <<'NODE'
          const eas = require('./eas.json');
          const p = eas?.build?.['open-finance-pilot-aab'];
          if (!p) throw new Error('open-finance-pilot-aab profile missing');
          if (p.android?.buildType !== 'app-bundle') throw new Error('AAB profile must build app-bundle');
          if (p.env?.EXPO_PUBLIC_NEXA_API_URL !== 'https://nexa-backend-p2u0.onrender.com/api/v1') throw new Error('Main API mismatch');
          if (p.env?.EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_API_URL !== 'https://nexa-backend-p2u0.onrender.com/api/v1') throw new Error('Open Finance API mismatch');
          if (p.env?.EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED !== 'false') throw new Error('Financial execution must remain OFF');
          if (p.env?.EXPO_PUBLIC_NEXA_ASSISTANT_ENABLED !== 'true') throw new Error('Assistant must be ON');
          if (p.env?.EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_ENABLED !== 'true') throw new Error('Open Finance UI must be ON');
          if (p.env?.EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_RECURRING_ENABLED !== 'false') throw new Error('Recurring Open Finance UI must be OFF');
          console.log('Integrated AAB profile OK.');
          NODE

      - name: Validate release identity and contracts
        env:
          EXPO_PUBLIC_NEXA_API_URL: 'https://nexa-backend-p2u0.onrender.com/api/v1'
          EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_API_URL: 'https://nexa-backend-p2u0.onrender.com/api/v1'
          EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED: 'false'
          EXPO_PUBLIC_NEXA_ASSISTANT_ENABLED: 'true'
          EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_ENABLED: 'true'
          EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_RECURRING_ENABLED: 'false'
          EXPO_PUBLIC_NEXA_RELEASE_CHANNEL: 'open-finance-pilot-aab'
        run: |
          set -euo pipefail
          npx expo config --type public --json > expo-public-config.json
          node <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('expo-public-config.json', 'utf8'));
          const expectedVersion = process.env.EXPECTED_VERSION;
          const expectedBuild = Number(process.env.EXPECTED_BUILD);
          if (c.name !== 'Nexa') throw new Error('Unexpected app name');
          if (c.android?.package !== 'br.com.trynexa.app') throw new Error('Unexpected Android package');
          if (c.version !== expectedVersion) throw new Error(`Unexpected version ${c.version}`);
          if (Number(c.android?.versionCode) !== expectedBuild) throw new Error(`Unexpected versionCode ${c.android?.versionCode}`);
          const plugins = JSON.stringify(c.plugins || []);
          if (!plugins.includes('expo-notifications')) throw new Error('expo-notifications plugin missing');
          if (!plugins.includes('expo-speech-recognition')) throw new Error('speech recognition plugin missing');
          console.log(`Release identity OK: Nexa ${expectedVersion} v${expectedBuild} / br.com.trynexa.app.`);
          NODE
          test -f app/open-finance.tsx
          test -f app/open-finance-recurring.tsx
          test -f src/lib/efiOpenFinance.ts
          test -f src/components/NexaAssistantOpenFinance.tsx
          grep -q 'ExpoSpeechRecognitionModule' src/components/NexaAssistantOpenFinance.tsx
          grep -q 'parseRecurringFundingIntent' src/components/NexaAssistantOpenFinance.tsx

      - name: Validate mobile safety contracts
        run: node scripts/validate-mobile-safety.js

      - name: Validate release assets
        run: node scripts/validate-release-assets.js

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Export Android bundle
        env:
          CI: 'true'
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_NEXA_API_URL: 'https://nexa-backend-p2u0.onrender.com/api/v1'
          EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_API_URL: 'https://nexa-backend-p2u0.onrender.com/api/v1'
          EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED: 'false'
          EXPO_PUBLIC_NEXA_ASSISTANT_ENABLED: 'true'
          EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_ENABLED: 'true'
          EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_RECURRING_ENABLED: 'false'
          EXPO_PUBLIC_NEXA_RELEASE_CHANNEL: 'open-finance-pilot-aab'
        run: npm run export:android

      - name: Build signed integrated AAB
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: 'true'
          NODE_ENV: 'production'
          EXPO_NO_TELEMETRY: '1'
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
          EAS_LOCAL_BUILD_SKIP_CLEANUP: '1'
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/nexa-open-finance-pilot-aab
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/local-build-artifacts-open-finance-aab
        run: |
          set -euo pipefail
          FILE="Nexa-Assistant-Open-Finance-Pilot-${EXPECTED_VERSION}-v${EXPECTED_BUILD}.aab"
          rm -f "$FILE"
          eas build --platform android --profile open-finance-pilot-aab --local --non-interactive --output "$GITHUB_WORKSPACE/$FILE"
          test -s "$FILE"
          SHA256=$(sha256sum "$FILE" | awk '{print $1}')
          echo "aab_file=$FILE" >> "$GITHUB_ENV"
          echo "aab_sha256=$SHA256" >> "$GITHUB_ENV"
          ls -lh "$FILE"

      - name: Verify AAB signature and archive structure
        run: |
          set -euo pipefail
          jarsigner -verify -verbose -certs "${{ env.aab_file }}" > aab-signature.txt
          grep -q 'jar verified' aab-signature.txt
          unzip -l "${{ env.aab_file }}" > aab-contents.txt
          grep -q 'base/manifest/AndroidManifest.xml' aab-contents.txt
          grep -q 'base/dex/classes.dex' aab-contents.txt
          printf '%s  %s\n' "${{ env.aab_sha256 }}" "${{ env.aab_file }}" > SHA256SUMS.txt
          echo 'AAB VERIFIED: signed bundle archive with base manifest/dex present.'

      - name: Upload verified integrated AAB
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-Assistant-Open-Finance-Pilot-AAB-VERIFIED
          path: |
            ${{ env.aab_file }}
            SHA256SUMS.txt
            aab-signature.txt
            aab-contents.txt
            expo-public-config.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-Assistant-Open-Finance-Pilot-AAB-build-diagnostics
          path: |
            ${{ runner.temp }}/nexa-open-finance-pilot-aab/logs
            local-build-artifacts-open-finance-aab
          if-no-files-found: warn
          retention-days: 14
