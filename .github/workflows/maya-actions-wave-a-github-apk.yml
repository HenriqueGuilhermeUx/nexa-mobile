name: Build Maya Actions Wave A standalone Android QA APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/maya-actions-wave-a-github-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  preview-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out frozen Maya Actions Wave A QA release
        uses: actions/checkout@v4
        with:
          ref: release/maya-actions-v148-wave-a-20261104
      - name: Freeze exact Wave A SHA
        run: test "$(git rev-parse HEAD)" = '096c9fd619a551f23ba8c7d9e3e72a7e01605a6e'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install frozen Wave A dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate TypeScript
        run: npm run typecheck
      - name: Validate Maya Actions local contracts
        run: |
          node scripts/validate-maya-actions-v1.js
          node scripts/validate-maya-actions-agenda-v1.js
          node scripts/validate-maya-planning-v1.js
          node scripts/validate-maya-web-quotes-v1.js
          node scripts/validate-mobile-safety-v123.js
      - name: Isolate APK identity from installed Nexa Play app
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'app.json';
          const doc = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (doc.expo.version !== '2.0.43' || doc.expo.android.versionCode !== 148) throw Error('Wrong released baseline');
          doc.expo.name = 'Nexa Maya Actions QA';
          doc.expo.slug = 'nexa-maya-actions-qa';
          doc.expo.scheme = 'nexa-maya-actions-qa';
          doc.expo.android.package = 'br.com.trynexa.mayaqa';
          // The backend version gate enforces min build 144 even on the isolated QA package.
          // Keep the Play baseline's build code without changing its applicationId or signing.
          doc.expo.android.versionCode = 148;
          doc.expo.extra.financialExecutionEnabled = false;
          doc.expo.extra.releaseChannel = 'internal-maya-qa';
          delete doc.expo.updates;
          fs.writeFileSync(path, JSON.stringify(doc, null, 2) + '\n');
          NODE
      - name: Ensure test APK is isolated from OTA production
        run: |
          node <<'NODE'
          const app=require('./app.json').expo;
          if (app.android.package !== 'br.com.trynexa.mayaqa' || app.updates) throw Error('QA app must not share production package or live OTA');
          if (app.version !== '2.0.43' || app.android.versionCode !== 148) throw Error('Wrong QA identity or build below min 144');
          NODE
      - name: Generate Android native project
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED: 'false'
          EXPO_PUBLIC_NEXA_API_URL: 'https://nexa-backend-p2u0.onrender.com/api/v1'
        run: npx expo prebuild --platform android --clean --no-install
      - name: Configure bounded Gradle memory and arm64-only internal QA
        run: |
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          org.gradle.parallel=false
          reactNativeArchitectures=arm64-v8a
          EOF
      - name: Assemble standalone release-mode APK (test signing only)
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED: 'false'
          EXPO_PUBLIC_NEXA_API_URL: 'https://nexa-backend-p2u0.onrender.com/api/v1'
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=1 --no-parallel --no-configuration-cache -PreactNativeArchitectures=arm64-v8a -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease
      - name: Sign isolated test APK with disposable QA key and verify
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/nexa-qa.jks" -storepass android -keypass android -alias nexaqa -keyalg RSA -keysize 3072 -validity 2 -dname "CN=Nexa Maya Actions QA"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED" ]; then
            UNSIGNED="android/app/build/outputs/apk/release/app-release.apk"
          fi
          test -f "$UNSIGNED"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/nexa-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/nexa-qa.jks" --ks-key-alias nexaqa --ks-pass pass:android --key-pass pass:android --out nexa-maya-wave-a-v148-build148-qa-signed.apk "$RUNNER_TEMP/nexa-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose nexa-maya-wave-a-v148-qa-signed.apk
      - name: Upload APK to GitHub Actions for internal test
        uses: actions/upload-artifact@v4
        with:
          name: nexa-maya-actions-wave-a-v148-build148-standalone-qa-apk
          path: nexa-maya-wave-a-v148-qa-signed.apk
          if-no-files-found: error
          retention-days: 7
      - name: Record QA artifact result in issue 126
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          printf '%s\n' "**Maya Actions Wave A — GitHub standalone QA APK build: $JOB_STATUS**" "" "Workflow: $RUN_URL" "Artifact name (only if successful): nexa-maya-actions-wave-a-v148-standalone-qa-apk" "Standalone package: br.com.trynexa.mayaqa; test signing only; no EAS cloud build quota used." "This APK bundles the Wave A screens but does not test EAS OTA delivery and may require Privy login configuration for the QA package." "Do not confuse with the Play production app or use live financial transactions." > /tmp/maya-standalone-result.md
          gh issue comment 126 --repo "${{ github.repository }}" --body-file /tmp/maya-standalone-result.md
