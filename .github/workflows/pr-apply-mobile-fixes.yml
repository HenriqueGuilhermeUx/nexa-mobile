name: PR apply mobile fixes

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-decimal-pix-withdrawal
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply branch patch
        run: |
          node scripts/apply-decimal-privy-fixes.js
          node scripts/validate-decimal-and-privy-onboarding.js
          git checkout -- .github/workflows/mobile-ci.yml
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.js nexa-mobile/nexa-mobile/App.js app/onboarding-wallet.tsx 'app/(app)/new-order.tsx'
          if ! git diff --cached --quiet; then
            git commit -m "Fix decimal inputs and make Privy audit non-blocking"
            git push origin HEAD:agent/fix-decimal-pix-withdrawal
          fi
