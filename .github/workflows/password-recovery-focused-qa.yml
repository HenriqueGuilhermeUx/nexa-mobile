name: Nexa native password recovery — focused QA
on:
  pull_request:
    paths:
      - 'app/forgot-password.tsx'
      - 'app/sign-in.tsx'
      - 'app/kyc.tsx'
      - 'app/sign-up.tsx'
      - 'src/lib/onboarding.ts'
      - 'app/_layout.tsx'
      - 'src/lib/api.ts'
      - '.github/workflows/password-recovery-focused-qa.yml'
  workflow_dispatch:
jobs:
  password-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run export:android
      - name: Validate forgot password navigation and backend contract
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const signin = fs.readFileSync('app/sign-in.tsx','utf8');
          const reset = fs.readFileSync('app/forgot-password.tsx','utf8');
          const api = fs.readFileSync('src/lib/api.ts','utf8');
          const kyc = fs.readFileSync('app/kyc.tsx','utf8');
          const signup = fs.readFileSync('app/sign-up.tsx','utf8');
          const onboarding = fs.readFileSync('src/lib/onboarding.ts','utf8');
          assert.match(signin, /pathname: '\/forgot-password'/);
          assert.doesNotMatch(signin, /Linking\.openURL\('https:\/\/trynexa\.com\.br\/login'\)/);
          assert.match(api, /'\/auth\/forgot-password'/);
          assert.match(api, /'\/auth\/reset-password'/);
          assert.match(reset, /\^\\d\{6\}\$/);
          assert.match(reset, /newPassword\.length < 8/);
          assert.match(reset, /newPassword !== confirmPassword/);
          assert.match(signup, /router\.replace\('\/onboarding-wallet' as any\)/);
          assert.doesNotMatch(signup, /router\.replace\('\/kyc' as any\)/);
          assert.match(kyc, /if \(!hasLinkedPrivyWallet\(profile\)\)/);
          assert.match(kyc, /router\.replace\('\/onboarding-wallet'/);
          assert.match(onboarding, /if \(!hasLinkedPrivyWallet\(profile\)\)/);
          assert.match(onboarding, /return '\/onboarding-wallet'/);
          console.log('Native recovery and Privy-before-KYC routing contracts OK');
          NODE
