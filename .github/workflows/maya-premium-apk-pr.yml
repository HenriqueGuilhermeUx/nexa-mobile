name: Nexa Maya Premium APK (isolated PR)
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/maya-premium.tsx'
      - 'app/assistant.tsx'
      - 'package.json'
      - '.github/workflows/maya-premium-android-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/nexa-maya-premium-readonly-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_NEXA_MAYA_PREMIUM_ENABLED: 'true'
      EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'feat/nexa-maya-premium-readonly-20261102' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require Expo credentials
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::EXPO_TOKEN missing"; exit 1; }
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npx expo-doctor
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas build --platform android --profile maya-premium-preview --non-interactive --wait
