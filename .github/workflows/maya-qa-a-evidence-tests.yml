name: Maya QA A evidence unit tests (wave 02 only)
on:
  push:
    branches:
      - feat/maya-actions-02-planejamento-v148
    paths:
      - 'scripts/validate-maya-qa-a-evidence.js'
      - 'scripts/validate-maya-qa-a-evidence.test.js'
      - 'scripts/check-maya-qa-installed-package.js'
      - 'scripts/check-maya-qa-installed-package.test.js'
      - '.github/workflows/maya-qa-a-evidence-tests.yml'
  pull_request:
    branches:
      - integration/maya-actions-v148
    paths:
      - 'scripts/validate-maya-qa-a-evidence.js'
      - 'scripts/validate-maya-qa-a-evidence.test.js'
      - 'scripts/check-maya-qa-installed-package.js'
      - 'scripts/check-maya-qa-installed-package.test.js'
      - '.github/workflows/maya-qa-a-evidence-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline evidence gate regression tests
        run: node --test scripts/validate-maya-qa-a-evidence.test.js scripts/check-maya-qa-installed-package.test.js
