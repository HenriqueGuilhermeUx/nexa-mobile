name: Central Nexa — read-only EAS production baseline inventory
on:
  push:
    branches:
      - feat/central-nexa-push-optin-v148-20261112
    paths:
      - '.github/workflows/central-nexa-eas-inventory-readonly.yml'
  pull_request:
    paths:
      - '.github/workflows/central-nexa-eas-inventory-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-eas:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Ensure EAS token exists without printing it
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EAS_INVENTORY_BLOCKED: GitHub secret EXPO_TOKEN not configured"
            exit 1
          fi
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 24.8.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Read-only EAS channel and update inventory with safe summaries
        shell: bash
        run: |
          set -euo pipefail
          if eas channel:list --json --non-interactive > /tmp/nexa-channels.json 2>/tmp/nexa-channels-error; then
            node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/nexa-channels.json','utf8'));
          const rows=Array.isArray(data)?data:Array.isArray(data.channels)?data.channels:Array.isArray(data.results)?data.results:[];
          console.log('EAS_CHANNEL_COUNT='+rows.length);
          rows.filter(x=>String(x.name||'').includes('production')).forEach(x=>{
            const mapping=x.branchMapping||x.branch||{};
            console.log('EAS_CHANNEL='+JSON.stringify({
              name:x.name,branch:typeof mapping==='string'?mapping:(mapping.name||mapping.branchName||null),
              runtimeVersion:x.runtimeVersion||null
            }));
          });
          NODE
          else
            echo "EAS_CHANNEL_LIST_FAILED: no channel details available"
          fi
          if eas branch:list --json --non-interactive > /tmp/nexa-branches.json 2>/tmp/nexa-branches-error; then
            node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/nexa-branches.json','utf8'));
          const rows=Array.isArray(data)?data:Array.isArray(data.branches)?data.branches:[];
          console.log('EAS_BRANCH_COUNT='+rows.length);
          console.log('EAS_BRANCH_NAMES='+rows.map(x=>x.name).filter(x=>typeof x==='string').slice(0,35).join(','));
          NODE
          else
            echo "EAS_BRANCH_LIST_FAILED: no branch details available"
          fi
          if eas update:list --all --platform android --limit 15 --json --non-interactive > /tmp/nexa-updates.json 2>/tmp/nexa-updates-error; then
            node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/nexa-updates.json','utf8'));
          const rows=Array.isArray(data)?data:Array.isArray(data.updates)?data.updates:Array.isArray(data.updateGroups)?data.updateGroups:[];
          console.log('EAS_ANDROID_UPDATE_COUNT='+rows.length);
          rows.slice(0,12).forEach(x=>console.log('EAS_UPDATE='+JSON.stringify({
            id:x.group||x.groupId||x.id||null,
            branch:x.branch?.name||x.branchName||null,
            runtimeVersion:x.runtimeVersion||x.updates?.[0]?.runtimeVersion||null,
            gitCommitHash:x.gitCommitHash||x.updates?.[0]?.gitCommitHash||null,
            createdAt:x.createdAt||null
          })));
          NODE
          else
            echo "EAS_UPDATES_LIST_FAILED: no update details available"
          fi
          echo "AUDIT_ONLY_NO_CHANGES"
