name: Nexa Mobile CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate dependency tree
        run: npm ls --depth=0
      - name: Validate mobile safety contracts
        run: node scripts/validate-mobile-safety-v123.js
      - name: Validate Wallet-First exit quote customer surface
        run: node scripts/validate-wallet-first-exit-quote.js
      - name: Validate Wallet-First USDC to Pix execution flow
        run: node scripts/validate-wallet-first-exit-flow.js
      - name: Validate Wallet-First send, swap and funding customer flows
        run: node scripts/validate-wallet-first-user-actions.js
      - name: Validate cross-device wallet recovery
        run: node scripts/validate-wallet-cross-device-recovery.js
      - name: Validate biometric app lock and OTA boundary
        run: node scripts/validate-biometric-app-lock.js
      - name: Validate Android release assets
        run: node scripts/validate-release-assets.js
      - name: Validate TypeScript
        run: npm run typecheck
      - name: Validate Expo project
        run: npx expo-doctor
      - name: Export Android JavaScript bundle
        env:
          CI: 'true'
        run: npm run export:android
