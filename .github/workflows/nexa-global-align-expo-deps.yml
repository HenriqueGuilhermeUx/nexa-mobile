name: Nexa Global Align Expo Dependencies

on:
  push:
    branches:
      - feat/nexa-global-v1
    paths:
      - '.github/workflows/nexa-global-align-expo-deps.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/nexa-global-v1
      - uses: actions/setup-node@v6
        with:
          node-version: '20.20.2'
          cache: npm
      - name: Align Expo SDK 57 patch dependencies
        run: |
          set -euo pipefail
          npm pkg set dependencies.expo-camera=57.0.6 dependencies.expo-image-picker=57.0.20
          npm install --package-lock-only --no-audit --no-fund
          node - <<'NODE'
          const pkg=require('./package.json');
          if(pkg.dependencies['expo-camera']!=='57.0.6') throw new Error('expo-camera not aligned');
          if(pkg.dependencies['expo-image-picker']!=='57.0.20') throw new Error('expo-image-picker not aligned');
          NODE
      - name: Commit aligned dependency lock
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(global): align Expo SDK 57 patch dependencies"
          git push origin HEAD:feat/nexa-global-v1
