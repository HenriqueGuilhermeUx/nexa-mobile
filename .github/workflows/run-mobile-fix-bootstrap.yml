name: Run one-time mobile fix bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-mobile-fix-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-decimal-pix-withdrawal
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract branch patch command
        run: |
          python <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-decimal-privy-fixes.yml').read_text()
          marker = '      - name: Patch mobile sources\n'
          start = source.index(marker)
          run = source.index('        run: |\n', start) + len('        run: |\n')
          end = source.index('\n      - name: Validate source patch', run)
          lines = source[run:end].splitlines()
          Path('/tmp/apply-mobile-fix.sh').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n')
          PY
          bash /tmp/apply-mobile-fix.sh

      - name: Validate patch
        run: node scripts/validate-decimal-and-privy-onboarding.js

      - name: Commit target branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.js nexa-mobile/nexa-mobile/App.js app/onboarding-wallet.tsx 'app/(app)/new-order.tsx' .github/workflows/mobile-ci.yml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix decimal inputs and make Privy audit non-blocking"
            git push origin HEAD:agent/fix-decimal-pix-withdrawal
          fi
