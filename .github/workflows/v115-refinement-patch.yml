name: Apply v115 refinement patch

on:
  push:
    branches:
      - feature/aab-v115-release-refinement
    paths:
      - '.github/workflows/v115-refinement-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/aab-v115-release-refinement
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Apply targeted v115 refinements
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceExact(file, needle, replacement) {
            const before = fs.readFileSync(file, 'utf8');
            if (!before.includes(needle)) {
              throw new Error(`Expected patch anchor not found in ${file}: ${needle.slice(0, 120)}`);
            }
            const after = before.replace(needle, replacement);
            fs.writeFileSync(file, after);
          }

          replaceExact(
            'src/components/AlignedLegacyApp.tsx',
            `          <MenuTile icon="✦" title="Rewards" onPress={() => setPage('rewards')} />\n          <MenuTile\n            icon="🔐"`,
            `          <MenuTile icon="✦" title="Rewards" onPress={() => setPage('rewards')} />\n          <MenuTile\n            icon="🛡️"\n            title="Segurança"\n            subtitle="Biometria e proteção"\n            onPress={() => router.push('/security')}\n          />\n          <MenuTile\n            icon="🔐"`,
          );

          replaceExact(
            'app/open-finance.tsx',
            `import { config } from '@/config';\nimport {\n  efiOpenFinanceApi,`,
            `import { config } from '@/config';\nimport { reauthenticateSensitiveAction } from '@/lib/appLock';\nimport {\n  efiOpenFinanceApi,`,
          );

          replaceExact(
            'app/open-finance.tsx',
            `    const participantId = participantIdOf(selected);\n    if (!participantId) return setMessage('Não foi possível identificar esse banco.');\n\n    try {\n      setLoading(true);`,
            `    const participantId = participantIdOf(selected);\n    if (!participantId) return setMessage('Não foi possível identificar esse banco.');\n\n    const localConfirmation = await reauthenticateSensitiveAction(\n      'Autorizar entrada via Open Finance',\n    );\n    if (!localConfirmation.success) {\n      return setMessage(\n        'Confirme sua identidade para iniciar a autorização no seu banco.',\n      );\n    }\n\n    try {\n      setLoading(true);`,
          );

          const validator = 'scripts/validate-mobile-safety.js';
          let safety = fs.readFileSync(validator, 'utf8');
          safety = safety
            .replaceAll("'2.0.19'", "'2.0.20'")
            .replaceAll('/2\\.0\\.19/', '/2\\.0\\.20/')
            .replaceAll('versionCode, 114', 'versionCode, 115')
            .replaceAll("buildNumber, '114'", "buildNumber, '115'")
            .replaceAll('/114/', '/115/')
            .replaceAll('2.0.19 v114', '2.0.20 v115');
          fs.writeFileSync(validator, safety);
          NODE
      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AlignedLegacyApp.tsx app/open-finance.tsx scripts/validate-mobile-safety.js package-lock.json
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'feat(release): refine v115 security UX and sensitive authorization'
          git push origin HEAD:feature/aab-v115-release-refinement
