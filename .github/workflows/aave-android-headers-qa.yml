name: Aave Android header regression QA
on:
  push:
    branches: [fix/aave-qa-android-request-headers-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aave-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Confirm Aave header regression and eligibility
        run: |
          node scripts/validate-aave-android-headers.cjs
          node scripts/validate-aave-eligibility.cjs
      - name: TypeScript verification
        run: npm run typecheck
