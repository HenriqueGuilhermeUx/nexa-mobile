name: Nexa channel consents — guarded live Android OTA
on:
  push:
    branches: [release/nexa-consent-preserve-privy-20261124]
    paths: ['.github/workflows/nexa-consent-live-android-ota.yml']
permissions:
  contents: read
concurrency:
  group: nexa-consent-safe-production-android
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: nexa-privy-qa
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: test -n "$EXPO_TOKEN"
      - name: Ensure exact approved release lineage and scoped modifications
        run: |
          set -euo pipefail
          git fetch origin release/nexa-deposit-funnel-verified-prod-20261123 --depth=1
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process'),assert=require('assert');
          const base='origin/release/nexa-deposit-funnel-verified-prod-20261123';
          const prev=cp.execFileSync('git',['rev-parse',base],{encoding:'utf8'}).trim();
          assert(prev==='e08592ce0dd07b191759d1cb9c16593cc943eb58',
            'Unexpected production base changed');
          const allowed=new Set([
            'app/sign-up.tsx','src/lib/api.ts','app/security.tsx',
            'app/communication-preferences.tsx',
            '.github/workflows/nexa-consent-production-release-ci.yml',
            '.github/workflows/nexa-consent-live-android-ota.yml'
          ]);
          const paths=cp.execFileSync('git',['diff','--name-only',base,'HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          assert(paths.length>=4 && paths.every(p=>allowed.has(p)),
            'Unreviewed production file change: '+paths.join(','));
          const signup=fs.readFileSync('app/sign-up.tsx','utf8');
          for(const v of ['usePrivy','privy.logout()',"'/onboarding-wallet'",'communicationConsents']){
            assert(signup.includes(v),'Missing production Privy or consent: '+v);
          }
          const api=fs.readFileSync('src/lib/api.ts','utf8');
          assert(api.includes('getCommunicationConsents') && api.includes('communicationConsents?:'));
          const order=fs.readFileSync('app/(app)/new-order.tsx','utf8');
          assert(order.includes('deposit_screen_opened')&&order.includes('pix_method_selected'));
          NODE
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npx expo export --platform android --output-dir dist-nexa-consents
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 27.9.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Fail closed unless previously verified Android production is unchanged
        run: |
          node - <<'NODE'
          (async () => {
            const q='query($appId:String!){app{byId(appId:$appId){updateChannelByName(name:"production"){updateBranches(offset:0,limit:10){name}} prod:updateBranchByName(name:"production"){updates(offset:0,limit:8){id gitCommitHash platform group}}}}}';
            const response=await fetch('https://api.expo.dev/graphql',{
              method:'POST',
              headers:{Authorization:'Bearer '+process.env.EXPO_TOKEN,'Content-Type':'application/json'},
              body:JSON.stringify({query:q,variables:{appId:'b3faabec-283a-4ba2-88b5-f096304e68aa'}}),
              signal:AbortSignal.timeout(20000)
            });
            const data=await response.json();
            if(!response.ok||data.errors?.length)throw Error('EXPO_PRODUCTION_AUDIT_UNAVAILABLE');
            const app=data.data?.app?.byId;
            const branches=app?.updateChannelByName?.updateBranches?.map(x=>x.name)||[];
            const android=app?.prod?.updates?.find(x=>x.platform==='android');
            console.log('NEXA_CONSENT_OTA_PREFLIGHT='+JSON.stringify({
              branches,androidId:android?.id,androidSha:android?.gitCommitHash,group:android?.group
            }));
            if(branches.length!==1||branches[0]!=='production'||
              android?.id!=='01a20a03-2889-79f0-b21a-454d072b7d0d'||
              android?.gitCommitHash!=='e08592ce0dd07b191759d1cb9c16593cc943eb58'||
              android?.group!=='4cda6cef-f512-45e1-bfe7-b01c17ad92c7')
              throw Error('FAIL_CLOSED_PRODUCTION_CHANGED_NO_OTA');
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
      - name: Publish reviewed consent UI to Android production only
        run: |
          eas update --branch production --platform android \
            --message "Nexa optional independent channel consent signup ${GITHUB_SHA}" \
            --non-interactive
      - name: Read back production publication
        run: eas update:list --branch production --limit 2 --non-interactive
