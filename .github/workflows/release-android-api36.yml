name: Release Android API 36 AAB — manual after homologation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/build-triggers/release-android-api36.txt'

permissions:
  contents: write

concurrency:
  group: nexa-android-api36-production
  cancel-in-progress: true

jobs:
  build:
    name: Nexa 2.0.11 Android 16 API 36 production AAB
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo authentication for Android credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || (echo "EXPO_TOKEN ausente" && exit 1)
          eas whoami

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Expo 57 native compatibility pins
        run: |
          node <<'NODE'
          const pkg = require('./package.json');
          const deps = pkg.dependencies || {};
          if (!String(deps.expo || '').startsWith('~57.')) throw new Error('Expo SDK 57 não configurado');
          if (deps.react !== '19.2.3') throw new Error('React 19.2.3 não configurado');
          if (!String(deps['react-native'] || '').startsWith('0.86.')) throw new Error('React Native 0.86 não configurado');
          if (deps['react-native-reanimated'] !== '4.5.1') throw new Error('react-native-reanimated deve ser 4.5.1');
          if (deps['react-native-worklets'] !== '0.10.1') throw new Error('react-native-worklets deve ser 0.10.1');
          console.log('Expo 57 native pins OK.');
          NODE

      - name: Preflight production backend compatibility
        shell: bash
        run: |
          set -euo pipefail
          API="https://nexa-backend-p2u0.onrender.com/api/v1"

          curl --fail --silent --show-error --retry 8 --retry-delay 10 --max-time 20 "$API/health" -o prod-health.json
          curl --fail --silent --show-error --max-time 20 "$API/app/version" -o prod-version.json
          curl --fail --silent --show-error --max-time 20 "$API/rewards/plans" -o prod-rewards.json
          curl --fail --silent --show-error --max-time 20 "$API/swap/tokens" -o prod-tokens.json

          for route in /recurring-pix/me /custody/overview /wallet/my-privy /rewards/positions; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$API$route")"
            echo "$route -> HTTP $status"
            if [ "$status" != "401" ] && [ "$status" != "403" ]; then
              echo "Production backend does not expose the guarded V1.5 route: $route"
              exit 1
            fi
          done

          node <<'NODE'
          const fs = require('fs');

          const health = JSON.parse(fs.readFileSync('prod-health.json', 'utf8'));
          const version = JSON.parse(fs.readFileSync('prod-version.json', 'utf8'));
          const rewards = JSON.parse(fs.readFileSync('prod-rewards.json', 'utf8'));
          const tokens = JSON.parse(fs.readFileSync('prod-tokens.json', 'utf8'));

          if (String(health.status || '').toLowerCase() !== 'ok') {
            throw new Error('Production health is not OK.');
          }
          if (version.success !== true) {
            throw new Error('Production app-version policy is unavailable.');
          }

          const latestBuild = Number(version.latestBuild || 0);
          const latestVersion = String(version.latestVersion || '');
          if (latestBuild < 104 || latestVersion !== '2.0.11') {
            throw new Error(
              'Production backend is not advertising Nexa 2.0.11 build 104: ' +
                JSON.stringify(version),
            );
          }

          const minimumBuild = Number(version.minimumBuild || 0);
          if (minimumBuild > 104) {
            throw new Error('Production would block the release build itself.');
          }

          if (Number(rewards?.economics?.userRewardShare) !== 0.8) {
            throw new Error('Production Rewards user share must be 80%.');
          }
          if (Number(rewards?.economics?.nexaRewardShare) !== 0.2) {
            throw new Error('Production Rewards Nexa share must be 20%.');
          }

          const assets = Array.isArray(tokens?.launchAssets)
            ? tokens.launchAssets
            : [];
          if (JSON.stringify(assets) !== JSON.stringify(['USDC','BTC','ETH','XAUT'])) {
            throw new Error('Unexpected production launch assets: ' + JSON.stringify(assets));
          }
          if (tokens?.premiumRequired !== false) {
            throw new Error('BTC/ETH/XAUT must be available outside Premium.');
          }
          if (tokens?.internalTransferAsset !== 'USDC') {
            throw new Error('Internal transfers must remain USDC-only.');
          }

          console.log('Production backend compatibility preflight passed.');
          NODE

      - name: Apply protected Pix quote wording
        run: |
          set -euo pipefail
          sed -i 's/Cotação executável:/Cotação Nexa para venda:/g' nexa-mobile/nexa-mobile/App.js
          grep -q 'Cotação Nexa para venda:' nexa-mobile/nexa-mobile/App.js

      - name: Validate Nexa safety contracts
        id: safety
        run: node scripts/validate-mobile-safety.js

      - name: Validate decimal inputs and optional Privy
        id: decimal_privy
        run: node scripts/validate-decimal-and-privy-onboarding.js

      - name: Validate release assets and metadata
        id: release_assets
        run: node scripts/validate-release-assets.js

      - name: Validate TypeScript
        id: typecheck
        run: npm run typecheck

      - name: Validate Expo project
        id: doctor
        continue-on-error: true
        run: npx expo-doctor

      - name: Validate explicit Android 16 API 36 configuration
        id: api36_config
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const app = require('./app.json').expo;
          const plugin = (app.plugins || []).find(
            (item) => Array.isArray(item) && item[0] === 'expo-build-properties',
          );
          assert.ok(plugin, 'expo-build-properties não configurado');
          const android = plugin[1]?.android || {};
          assert.equal(Number(android.compileSdkVersion), 36);
          assert.equal(Number(android.targetSdkVersion), 36);
          assert.equal(String(android.buildToolsVersion), '36.0.0');
          assert.equal(Number(app.extra?.androidTargetApi), 36);
          assert.equal(app.version, '2.0.11');
          assert.equal(Number(app.android?.versionCode), 104);
          console.log('Android API 36 e Nexa 2.0.11 v104 confirmados no app.json.');
          NODE

      - name: Prove API 36 was applied by Expo prebuild
        id: api36_prebuild
        env:
          CI: 'true'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          rm -rf android
          npx expo prebuild --platform android --no-install --clean
          grep -Eq '^android\.compileSdkVersion=36$' android/gradle.properties \
            || (echo 'android.compileSdkVersion=36 não aplicado pelo prebuild' && exit 1)
          grep -Eq '^android\.targetSdkVersion=36$' android/gradle.properties \
            || (echo 'android.targetSdkVersion=36 não aplicado pelo prebuild' && exit 1)
          grep -Eq '^android\.buildToolsVersion=36\.0\.0$' android/gradle.properties \
            || (echo 'android.buildToolsVersion=36.0.0 não aplicado pelo prebuild' && exit 1)
          echo 'Expo prebuild confirmou compileSdk=36, targetSdk=36 e buildTools=36.0.0.'
          rm -rf android

      - name: Export Android JavaScript bundle
        id: export_bundle
        env:
          CI: 'true'
          EXPO_NO_TELEMETRY: '1'
        run: npm run export:android

      - name: Inspect exported bundle for regressions
        id: artifact_source
        run: node scripts/validate-built-artifact.js dist-ci

      - name: Build signed production AAB locally on GitHub Actions
        id: local_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: 'true'
          NODE_ENV: 'production'
          EXPO_NO_TELEMETRY: '1'
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
          EAS_LOCAL_BUILD_SKIP_CLEANUP: '1'
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/nexa-eas-local-v104
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/local-build-artifacts-v104
        run: |
          set -euo pipefail
          FILE='Nexa-2.0.11-Android16-v104.aab'
          rm -f "$FILE"
          eas build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output "$GITHUB_WORKSPACE/$FILE"
          test -s "$FILE"
          SHA256=$(sha256sum "$FILE" | awk '{print $1}')
          ls -lh "$FILE"
          echo "aab_file=$FILE" >> "$GITHUB_ENV"
          echo "aab_sha256=$SHA256" >> "$GITHUB_ENV"

      - name: Verify API 36 inside final AAB
        id: binary_api36
        run: |
          set -euo pipefail
          BUNDLETOOL_VERSION=1.18.1
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            --output "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest \
            --bundle="${{ env.aab_file }}" \
            --module=base \
            > aab-manifest.xml
          cat aab-manifest.xml
          grep -Eq 'package="br\.com\.trynexa\.app"' aab-manifest.xml
          grep -Eq 'android:versionCode="104"' aab-manifest.xml
          grep -Eq 'android:versionName="2\.0\.11"' aab-manifest.xml
          grep -Eq 'android:targetSdkVersion="36"' aab-manifest.xml \
            || (echo 'ERRO: AAB final não segmenta Android API 36' && exit 1)
          echo 'AAB final comprovado: Nexa 2.0.11 v104 targetSdkVersion=36.'

      - name: Upload verified AAB artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-2.0.11-Android16-v104-VERIFIED
          path: |
            ${{ env.aab_file }}
            aab-manifest.xml
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release with verified AAB
        id: publish_release
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='nexa-2.0.11-android16-v104'
          printf '%s  %s\n' "${{ env.aab_sha256 }}" "${{ env.aab_file }}" > SHA256SUMS.txt
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            "${{ env.aab_file }}" \
            aab-manifest.xml \
            SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title 'Nexa 2.0.11 · Brasil KYC · Android 16 · API 36 · v104' \
            --notes "Google Play AAB VERIFIED. Brazil KYC routing: CPF + Didit liveness/Unico-ready flow. Built locally on GitHub Actions. Package br.com.trynexa.app. Version 2.0.11. versionCode 104. targetSdkVersion 36. SHA-256: ${{ env.aab_sha256 }}."

      - name: Upload local build diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-2.0.11-v104-local-build-diagnostics
          path: |
            ${{ runner.temp }}/nexa-eas-local-v104/logs
            local-build-artifacts-v104
          if-no-files-found: warn
          retention-days: 14

      - name: Record final release outcome
        if: ${{ always() }}
        env:
          RELEASE_DOWNLOAD_URL: https://github.com/HenriqueGuilhermeUx/nexa-mobile/releases/download/nexa-2.0.11-android16-v104/Nexa-2.0.11-Android16-v104.aab
          BUILD_STATUS: ${{ job.status }}
          SAFETY_STATUS: ${{ steps.safety.conclusion }}
          DECIMAL_STATUS: ${{ steps.decimal_privy.conclusion }}
          ASSETS_STATUS: ${{ steps.release_assets.conclusion }}
          TYPECHECK_STATUS: ${{ steps.typecheck.conclusion }}
          DOCTOR_STATUS: ${{ steps.doctor.conclusion }}
          API36_CONFIG_STATUS: ${{ steps.api36_config.conclusion }}
          API36_PREBUILD_STATUS: ${{ steps.api36_prebuild.conclusion }}
          EXPORT_STATUS: ${{ steps.export_bundle.conclusion }}
          ARTIFACT_SOURCE_STATUS: ${{ steps.artifact_source.conclusion }}
          LOCAL_BUILD_STATUS: ${{ steps.local_build.conclusion }}
          BINARY_API36_STATUS: ${{ steps.binary_api36.conclusion }}
          RELEASE_STATUS: ${{ steps.publish_release.conclusion }}
        run: |
          set -euo pipefail
          STATUS_PATH='release-status/android-2.0.11-v104.json'
          STATUS_TMP="$RUNNER_TEMP/android-2.0.11-v104.json"
          mkdir -p release-status
          AAB_FILE="${aab_file:-}"
          AAB_SHA256="${aab_sha256:-}"
          cat > "$STATUS_PATH" <<EOF
          {
            "status": "$BUILD_STATUS",
            "version": "2.0.11",
            "versionCode": 104,
            "package": "br.com.trynexa.app",
            "buildMode": "github-actions-local-eas",
            "compileSdk": 36,
            "targetSdk": 36,
            "features": ["brazil_kyc_routing", "didit_unico_ready"],
            "steps": {
              "safety": "$SAFETY_STATUS",
              "decimalAndPrivy": "$DECIMAL_STATUS",
              "releaseAssets": "$ASSETS_STATUS",
              "typecheck": "$TYPECHECK_STATUS",
              "expoDoctor": "$DOCTOR_STATUS",
              "api36Config": "$API36_CONFIG_STATUS",
              "api36Prebuild": "$API36_PREBUILD_STATUS",
              "export": "$EXPORT_STATUS",
              "artifactSource": "$ARTIFACT_SOURCE_STATUS",
              "localBuild": "$LOCAL_BUILD_STATUS",
              "binaryApi36": "$BINARY_API36_STATUS",
              "release": "$RELEASE_STATUS"
            },
            "aabFile": "$AAB_FILE",
            "sha256": "$AAB_SHA256",
            "releaseDownloadUrl": "$RELEASE_DOWNLOAD_URL",
            "sourceCommit": "$GITHUB_SHA",
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cp "$STATUS_PATH" "$STATUS_TMP"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          mkdir -p release-status
          cp "$STATUS_TMP" "$STATUS_PATH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$STATUS_PATH"
          git commit -m "Record Nexa 2.0.11 Brazil KYC Android API 36 build outcome: $BUILD_STATUS" || true
          git push origin HEAD:main
