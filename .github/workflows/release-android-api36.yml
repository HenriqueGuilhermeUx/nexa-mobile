name: Release Android API 36 AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app.json'
      - 'package.json'
      - 'src/config.ts'
      - 'src/lib/legacy-financial-fetch-bridge.js'
      - 'nexa-mobile/nexa-mobile/App.js'
      - 'scripts/validate-mobile-safety.js'

permissions:
  contents: write

concurrency:
  group: nexa-android-api36-production
  cancel-in-progress: true

jobs:
  build:
    name: Nexa Android 16 production AAB
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.0'

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || (echo "EXPO_TOKEN ausente" && exit 1)
          eas whoami

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply protected Pix quote wording
        run: |
          set -euo pipefail
          sed -i 's/Cotação executável:/Cotação Nexa para venda:/g' nexa-mobile/nexa-mobile/App.js
          grep -q 'Cotação Nexa para venda:' nexa-mobile/nexa-mobile/App.js

      - name: Validate Nexa mobile contracts
        id: validate
        run: |
          node scripts/validate-mobile-safety.js
          npm run typecheck
          npx expo-doctor

      - name: Prove Android 16 / API 36 target
        id: api36
        env:
          CI: 'true'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          rm -rf android
          npx expo prebuild --platform android --no-install --clean
          echo '--- Android SDK configuration generated by Expo ---'
          grep -R -n -E 'compileSdkVersion[^0-9]*36|compileSdk[^0-9]*36' android || (echo 'compileSdk 36 não encontrado' && exit 1)
          grep -R -n -E 'targetSdkVersion[^0-9]*36|targetSdk[^0-9]*36' android || (echo 'targetSdk 36 não encontrado' && exit 1)
          rm -rf android

      - name: Export Android JavaScript bundle
        id: export_bundle
        env:
          CI: 'true'
          EXPO_NO_TELEMETRY: '1'
        run: npm run export:android

      - name: Build production AAB on EAS
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: 'true'
        run: |
          set -euo pipefail
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --clear-cache \
            --wait \
            --json > eas-build.json
          cat eas-build.json
          ARTIFACT_URL=$(node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('eas-build.json', 'utf8').trim();
          const start = raw.indexOf('[');
          const objectStart = raw.indexOf('{');
          const jsonStart = start >= 0 && (objectStart < 0 || start < objectStart) ? start : objectStart;
          if (jsonStart < 0) throw new Error('JSON do EAS não encontrado');
          const data = JSON.parse(raw.slice(jsonStart));
          const build = Array.isArray(data) ? data[0] : data;
          const url = build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl;
          if (!url) throw new Error('URL do AAB não encontrada na resposta do EAS');
          process.stdout.write(url);
          NODE
          )
          echo "artifact_url=$ARTIFACT_URL" >> "$GITHUB_OUTPUT"

      - name: Download production AAB
        id: download_aab
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./app.json').expo.version")
          VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          FILE="Nexa-${VERSION}-Android16-v${VERSION_CODE}.aab"
          curl --fail --location "${{ steps.eas_build.outputs.artifact_url }}" --output "$FILE"
          test -s "$FILE"
          SHA256=$(sha256sum "$FILE" | awk '{print $1}')
          ls -lh "$FILE"
          echo "aab_file=$FILE" >> "$GITHUB_ENV"
          echo "aab_sha256=$SHA256" >> "$GITHUB_ENV"

      - name: Upload AAB artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-2.0.8-Android16-v101
          path: ${{ env.aab_file }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release with AAB
        id: publish_release
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='nexa-2.0.8-android16-v101'
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "${{ env.aab_file }}" \
            --target "${GITHUB_SHA}" \
            --title 'Nexa 2.0.8 · Android 16 · API 36 · v101' \
            --notes "Production AAB for Google Play. Package: br.com.trynexa.app. Version: 2.0.8. versionCode: 101. Android target API: 36. SHA-256: ${{ env.aab_sha256 }}."

      - name: Record final release outcome
        if: ${{ always() }}
        env:
          RELEASE_DOWNLOAD_URL: https://github.com/HenriqueGuilhermeUx/nexa-mobile/releases/download/nexa-2.0.8-android16-v101/Nexa-2.0.8-Android16-v101.aab
          BUILD_STATUS: ${{ job.status }}
          VALIDATE_STATUS: ${{ steps.validate.conclusion }}
          API36_STATUS: ${{ steps.api36.conclusion }}
          EXPORT_STATUS: ${{ steps.export_bundle.conclusion }}
          EAS_STATUS: ${{ steps.eas_build.conclusion }}
          DOWNLOAD_STATUS: ${{ steps.download_aab.conclusion }}
          RELEASE_STATUS: ${{ steps.publish_release.conclusion }}
          EAS_ARTIFACT_URL: ${{ steps.eas_build.outputs.artifact_url }}
        run: |
          set -euo pipefail
          mkdir -p release-status
          AAB_FILE="${aab_file:-}"
          AAB_SHA256="${aab_sha256:-}"
          cat > release-status/android-2.0.8-v101.json <<EOF
          {
            "status": "$BUILD_STATUS",
            "version": "2.0.8",
            "versionCode": 101,
            "package": "br.com.trynexa.app",
            "compileSdk": 36,
            "targetSdk": 36,
            "steps": {
              "validate": "$VALIDATE_STATUS",
              "api36": "$API36_STATUS",
              "export": "$EXPORT_STATUS",
              "easBuild": "$EAS_STATUS",
              "download": "$DOWNLOAD_STATUS",
              "release": "$RELEASE_STATUS"
            },
            "aabFile": "$AAB_FILE",
            "sha256": "$AAB_SHA256",
            "easArtifactUrl": "$EAS_ARTIFACT_URL",
            "releaseDownloadUrl": "$RELEASE_DOWNLOAD_URL",
            "sourceCommit": "$GITHUB_SHA",
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-status/android-2.0.8-v101.json
          git commit -m "Record Nexa 2.0.8 Android build outcome: $BUILD_STATUS"
          git push origin HEAD:main
