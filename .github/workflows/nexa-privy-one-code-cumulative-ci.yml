name: Nexa cumulative Privy one-code preflight
on:
  pull_request:
    paths:
      - 'app/onboarding-wallet.tsx'
      - 'app/wallet-session.tsx'
      - 'app/wallet-ownership.tsx'
      - 'src/lib/onboarding.ts'
      - 'scripts/validate-privy-one-code-first-deposit.cjs'
      - '.github/workflows/nexa-privy-one-code-cumulative-ci.yml'
  push:
    branches:
      - release/nexa-privy-one-code-cumulative-qa-20261122
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/validate-privy-one-code-first-deposit.cjs
      - run: npm run typecheck
      - run: npm run export:android

  qa-expo:
    # Isolated QA branch only. Never writes to the production OTA channel.
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: nexa-privy-qa
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: test -n "$EXPO_TOKEN"
      - run: npm ci --ignore-scripts
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 27.9.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Preserve the Android production public feature flags
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const env=JSON.parse(fs.readFileSync('eas.json','utf8')).build.production.env;
          for(const [key,value] of Object.entries(env)){
            if(!/^EXPO_PUBLIC_[A-Z0-9_]+$/.test(key)||typeof value!=='string'||value.includes('\n'))throw Error('Invalid build env');
            fs.appendFileSync(process.env.GITHUB_ENV,key+'='+value+'\n');
          }
          NODE
      - name: Publish isolated Android QA update (not production)
        run: eas update --branch nexa-privy-one-code-cumulative-qa --platform android --message "Nexa verified Privy one-code QA ${{ github.sha }}" --non-interactive
