name: Nexa Privy Android — read-only Expo production rollout audit
on:
  push:
    branches: [ops/nexa-privy-rollout-100-20261122]
    paths: ['.github/workflows/nexa-privy-readonly-audit.yml']
  pull_request:
    branches: [release/nexa-privy-current-production-safe-20261122]
    paths: ['.github/workflows/nexa-privy-readonly-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: nexa-privy-qa
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 27.9.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Inspect CURRENT production update (read only)
        run: eas update:view 01a205ba-3316-7bae-8295-443a6810217a --non-interactive
      - name: Inspect production branch updates (read only)
        run: eas update:list --branch production --platform android --limit 5 --non-interactive
