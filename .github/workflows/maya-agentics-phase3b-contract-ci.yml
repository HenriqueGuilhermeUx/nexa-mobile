name: Maya Agentics Phase3B — contracts safety CI only
on:
  push:
    branches: [feat/maya-agentics-phase3b-client-contracts-v148-20261115]
    paths: ['.github/workflows/maya-agentics-phase3b-contract-ci.yml', 'src/maya-actions/agenticsPresentation.ts', 'scripts/validate-maya-agentics-presentation-v1.js', 'src/maya-actions/agenticsReviewPreview.ts', 'scripts/validate-maya-agentics-review-preview-v1.js']
permissions:
  contents: read
jobs:
  validate-contract-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Confirm isolated non-executable scope
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 47d09e55b3f8e4045e530402cb92c32327595031 HEAD
          node - <<'NODE'
          const cp=require('node:child_process');
          const diff=cp.execFileSync('git',['diff','--name-only','47d09e55b3f8e4045e530402cb92c32327595031','HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const allowed=['src/maya-actions/agenticsTaskContracts.ts','src/maya-actions/agenticsReadiness.ts','scripts/validate-maya-agentics-task-contracts-v1.js','scripts/validate-maya-agentics-readiness-v1.js','src/maya-actions/agenticsPresentation.ts','scripts/validate-maya-agentics-presentation-v1.js','src/maya-actions/agenticsReviewPreview.ts','scripts/validate-maya-agentics-review-preview-v1.js','docs/maya-agentics-phase3b-release-gates.md','.github/workflows/maya-agentics-phase3b-contract-ci.yml'];
          if(diff.some(f=>!allowed.includes(f)))throw Error('Unexpected live app changes: '+diff.join(','));
          console.log('ONLY_CONTRACT_FILES='+JSON.stringify(diff));
          NODE
      - run: npm ci --no-audit --no-fund
      - run: node scripts/validate-maya-agentics-task-contracts-v1.js
      - run: node scripts/validate-maya-agentics-readiness-v1.js
      - run: node scripts/validate-maya-agentics-presentation-v1.js
      - run: node scripts/validate-maya-agentics-review-preview-v1.js
      - run: npm run typecheck
      - name: Confirm release status
        run: echo 'Contracts validated, no Agentics actions executed, no OTA or production deployment authorized.'
