name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Force release configuration
        working-directory: nexa-mobile/nexa-mobile
        run: |
          node <<'NODE'
          const fs = require('fs');
          const appPath = './app.json';
          const pkgPath = './package.json';
          const app = JSON.parse(fs.readFileSync(appPath, 'utf8'));
          app.expo.version = '1.4.5';
          app.expo.android.versionCode = 25;
          app.expo.ios = app.expo.ios || {};
          app.expo.ios.buildNumber = '25';
          fs.writeFileSync(appPath, JSON.stringify(app, null, 2) + '\n');
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = '1.4.5';
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          console.log('Release forced to', app.expo.version, 'versionCode', app.expo.android.versionCode);
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: nexa-mobile/nexa-mobile/package.json

      - name: Install dependencies
        working-directory: nexa-mobile/nexa-mobile
        run: npm install

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo authentication
        working-directory: nexa-mobile/nexa-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || (echo "EXPO_TOKEN is missing" && exit 1)
          eas whoami

      - name: Verify release configuration
        working-directory: nexa-mobile/nexa-mobile
        run: |
          node -e "const app=require('./app.json').expo; console.log('Detected release config:', app.version, app.android.versionCode); if(app.version!=='1.4.5'||app.android.versionCode!==25){throw new Error('Release config mismatch: expected 1.4.5 / 25')}"
          npx expo config --type public

      - name: Build production AAB on EAS
        id: eas_build
        working-directory: nexa-mobile/nexa-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android --profile production --non-interactive --wait --json > eas-build.json
          cat eas-build.json
          ARTIFACT_URL=$(node -e "const fs=require('fs'); const raw=fs.readFileSync('eas-build.json','utf8'); const start=raw.indexOf('['); const data=JSON.parse(raw.slice(start)); const url=data[0]?.artifacts?.buildUrl; if(!url) process.exit(1); process.stdout.write(url)")
          echo "artifact_url=$ARTIFACT_URL" >> "$GITHUB_OUTPUT"

      - name: Download generated AAB
        working-directory: nexa-mobile/nexa-mobile
        run: curl --fail --location "${{ steps.eas_build.outputs.artifact_url }}" --output Nexa-1.4.5-versionCode-25.aab

      - name: Upload AAB to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-1.4.5-versionCode-25
          path: nexa-mobile/nexa-mobile/Nexa-1.4.5-versionCode-25.aab
          if-no-files-found: error
          retention-days: 30
