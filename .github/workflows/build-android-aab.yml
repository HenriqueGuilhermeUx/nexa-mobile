name: Build Android AAB

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Nome da versão. Ex: 1.4.6"
        required: true
        default: "1.4.6"
      version_code:
        description: "Código Android. Precisa ser maior que o último enviado na Play Console. Ex: 26"
        required: true
        default: "26"
      profile:
        description: "Perfil EAS"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview

concurrency:
  group: nexa-android-aab
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android AAB
    runs-on: ubuntu-latest
    timeout-minutes: 120

    defaults:
      run:
        working-directory: nexa-mobile/nexa-mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || (echo "EXPO_TOKEN ausente. Crie o secret EXPO_TOKEN no GitHub." && exit 1)
          eas whoami

      - name: Apply version and Pix fix
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const versionName = process.env.VERSION_NAME;
          const versionCode = Number(process.env.VERSION_CODE);

          if (!versionName) throw new Error('VERSION_NAME ausente');
          if (!Number.isInteger(versionCode) || versionCode <= 25) {
            throw new Error('VERSION_CODE precisa ser inteiro e maior que 25');
          }

          const pkgPath = './package.json';
          const appPath = './app.json';
          const appJsPath = './App.js';

          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = versionName;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

          const app = JSON.parse(fs.readFileSync(appPath, 'utf8'));
          app.expo.version = versionName;
          app.expo.android = app.expo.android || {};
          app.expo.android.package = 'br.com.trynexa.app';
          app.expo.android.versionCode = versionCode;
          app.expo.ios = app.expo.ios || {};
          app.expo.ios.buildNumber = String(versionCode);
          fs.writeFileSync(appPath, JSON.stringify(app, null, 2) + '\n');

          let text = fs.readFileSync(appJsPath, 'utf8');

          function replaceRequired(label, from, to) {
            if (text.includes(to)) {
              console.log(`${label}: já aplicado`);
              return;
            }
            if (!text.includes(from)) {
              throw new Error(`${label}: bloco esperado não encontrado`);
            }
            text = text.replace(from, to);
            console.log(`${label}: aplicado`);
          }

          replaceRequired(
            'Import Image',
            "  Linking,\n} from 'react-native';",
            "  Linking,\n  Image,\n} from 'react-native';"
          );

          replaceRequired(
            'Pix QR image state',
            "  const [depositValue, setDepositValue] = useState('');\n  const [pixCopyPaste, setPixCopyPaste] = useState('');\n  const [ticketUrl, setTicketUrl] = useState('');",
            "  const [depositValue, setDepositValue] = useState('');\n  const [pixCopyPaste, setPixCopyPaste] = useState('');\n  const [pixQrImage, setPixQrImage] = useState('');\n  const [ticketUrl, setTicketUrl] = useState('');"
          );

          replaceRequired(
            'Logout clears pix image',
            "    setPixCopyPaste('');\n    setTicketUrl('');",
            "    setPixCopyPaste('');\n    setPixQrImage('');\n    setTicketUrl('');"
          );

          replaceRequired(
            'Redeem quote show data',
            "      setRedeemQuote(data);\n      show(e.message);",
            "      setRedeemQuote(data);\n      show(data);"
          );

          const oldDeposit = `  async function depositarPix() {
    if (!user || !user.id) {
      show('Faça login primeiro');
      return;
    }
    if (getKycStatus() !== 'approved') {
      show('Conclua sua verificação de identidade antes de depositar Pix');
      setPage('menuScreen');
      return;
    }
    const amount = parseAmount(depositValue);
    if (!amount || amount < 10) {
      show('Depósito mínimo é R$ 10,00');
      return;
    }
    try {
      show('Gerando Pix Nexa...');
      const r = await fetch(API + '/fiat-deposit/woovi/create-charge', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          userId: user.id,
          amountBrl: amount,
        }),
      });
      const data = await r.json();
      if (!data.success) {
        show(data);
        return;
      }
      const charge = data.charge || {};
      const pix = charge.paymentMethods?.pix || {};
      const brCode = pix.brCode || charge.brCode || '';
      const qrImage = pix.qrCodeImage || charge.qrCodeImage || '';
      const paymentLink = charge.paymentLinkUrl || '';
      setPixCopyPaste(brCode);
      setTicketUrl(paymentLink || qrImage);
      show('Pix gerado com sucesso. Após o pagamento, a Nexa converte automaticamente para USDC.');
    } catch (e) {
      show('Erro depósito Pix: ' + e.message);
    }
  }
`;

          const newDeposit = `  async function depositarPix() {
    if (!user || !user.id) {
      show('Faça login primeiro');
      return;
    }
    if (getKycStatus() !== 'approved') {
      show('Conclua sua verificação de identidade antes de depositar Pix. Status atual: ' + getKycStatusLabel());
      return;
    }
    const amount = parseAmount(depositValue);
    if (!amount || amount < 10) {
      show('Depósito mínimo é R$ 10,00');
      return;
    }
    try {
      setPixCopyPaste('');
      setPixQrImage('');
      setTicketUrl('');
      show('Gerando Pix Nexa...');
      const r = await fetch(API + '/fiat-deposit/woovi/create-charge', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          userId: user.id,
          amountBrl: amount,
        }),
      });
      const data = await r.json();
      if (!data.success) {
        show(data);
        return;
      }
      const charge = data.charge || {};
      const pix = charge.paymentMethods?.pix || {};
      const brCode = pix.brCode || charge.brCode || data.copyPasteCode || data.brCode || '';
      const qrImage = pix.qrCodeImage || charge.qrCodeImage || data.qrCodeImage || '';
      const paymentLink = charge.paymentLinkUrl || data.paymentLinkUrl || '';

      setPixCopyPaste(brCode);
      setPixQrImage(qrImage);
      setTicketUrl(paymentLink);

      if (!brCode && !qrImage && !paymentLink) {
        show({
          success: false,
          message: 'Pix gerado, mas a resposta não trouxe QR Code, Pix copia e cola ou link de pagamento.',
          response: data,
        });
        return;
      }

      show('Pix gerado com sucesso. Use o QR Code, o Pix copia e cola ou o link de pagamento.');
    } catch (e) {
      show('Erro depósito Pix: ' + e.message);
    }
  }
`;
          replaceRequired('Deposit Pix function', oldDeposit, newDeposit);

          const oldRender = `            {pixCopyPaste ? (
              <View style={styles.pixBox}>
                <View style={styles.qrBox}><QRCode value={pixCopyPaste} size={180} /></View>
                <Text style={styles.copyText}>{pixCopyPaste}</Text>
              </View>
            ) : null}`;

          const newRender = `            {pixCopyPaste || pixQrImage || ticketUrl ? (
              <View style={styles.pixBox}>
                {pixQrImage ? (
                  <Image
                    source={{ uri: pixQrImage }}
                    style={{
                      width: 220,
                      height: 220,
                      alignSelf: 'center',
                      borderRadius: 16,
                      backgroundColor: 'white',
                      marginBottom: 12,
                    }}
                    resizeMode="contain"
                  />
                ) : pixCopyPaste && pixCopyPaste.length <= 1000 ? (
                  <View style={styles.qrBox}>
                    <QRCode value={pixCopyPaste} size={180} />
                  </View>
                ) : (
                  <View style={styles.receiptBox}>
                    <Text style={styles.itemText}>QR Code muito grande para renderizar no app.</Text>
                    <Text style={styles.rateText}>Use o Pix copia e cola abaixo ou abra o link de pagamento.</Text>
                  </View>
                )}

                {pixCopyPaste ? (
                  <>
                    <Text style={styles.receiptSmallLabel}>Pix copia e cola</Text>
                    <Text style={styles.copyText}>{pixCopyPaste}</Text>
                  </>
                ) : null}

                {ticketUrl ? (
                  <Button title="Abrir link de pagamento" onPress={function () { abrirLink(ticketUrl); }} />
                ) : null}
              </View>
            ) : null}`;
          replaceRequired('Deposit Pix render', oldRender, newRender);

          fs.writeFileSync(appJsPath, text);

          console.log('Config final:', {
            versionName,
            versionCode,
            packageName: app.expo.android.package,
            easProjectId: app.expo.extra?.eas?.projectId,
          });
          NODE

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate project without blocking build
        run: npx expo-doctor@latest || true

      - name: Confirm patched App.js before build
        run: |
          grep -q "Image," App.js
          grep -q "pixQrImage" App.js
          grep -q "QR Code muito grande" App.js
          grep -q "Status atual" App.js
          node -e "const app=require('./app.json').expo; console.log('Release config:', app.version, app.android.versionCode, app.android.package); if(app.android.versionCode<=25) throw new Error('versionCode inválido');"

      - name: Build production AAB on EAS
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --clear-cache \
            --wait \
            --json > eas-build.json
          cat eas-build.json
          ARTIFACT_URL=$(node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('eas-build.json', 'utf8').trim();
          const starts = [raw.indexOf('['), raw.indexOf('{')].filter((i) => i >= 0).sort((a, b) => a - b);
          if (!starts.length) {
            console.error(raw);
            process.exit(1);
          }
          const data = JSON.parse(raw.slice(starts[0]));
          const build = Array.isArray(data) ? data[0] : data;
          const url = build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl || build?.artifactUrl || build?.url;
          if (!url) {
            console.error(JSON.stringify(data, null, 2));
            process.exit(1);
          }
          process.stdout.write(url);
          NODE
          )
          echo "artifact_url=$ARTIFACT_URL" >> "$GITHUB_OUTPUT"

      - name: Download generated AAB
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          AAB_NAME="Nexa-${VERSION_NAME}-versionCode-${VERSION_CODE}.aab"
          curl --fail --location "${{ steps.eas_build.outputs.artifact_url }}" --output "$AAB_NAME"
          ls -lh "$AAB_NAME"

      - name: Upload AAB to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-${{ inputs.version_name }}-versionCode-${{ inputs.version_code }}
          path: nexa-mobile/nexa-mobile/Nexa-${{ inputs.version_name }}-versionCode-${{ inputs.version_code }}.aab
          if-no-files-found: error
          retention-days: 30
