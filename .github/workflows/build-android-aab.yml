name: Build Android AAB

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Nome da versão. Ex: 1.4.6"
        required: true
        default: "1.4.6"
      version_code:
        description: "Código Android. Precisa ser maior que o último enviado na Play Console. Ex: 26"
        required: true
        default: "26"
      profile:
        description: "Perfil EAS"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview

concurrency:
  group: nexa-android-aab
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android AAB
    runs-on: ubuntu-latest
    timeout-minutes: 120

    defaults:
      run:
        working-directory: nexa-mobile/nexa-mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || (echo "EXPO_TOKEN ausente. Crie o secret EXPO_TOKEN no GitHub." && exit 1)
          eas whoami

      - name: Prepare release and Pix fix
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: node scripts/prepare-release.js

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate project without blocking build
        run: npx expo-doctor@latest || true

      - name: Confirm patched App.js before build
        run: |
          grep -q "Image," App.js
          grep -q "pixQrImage" App.js
          grep -q "QR Code muito grande" App.js
          grep -q "Status atual" App.js
          node -e "const app=require('./app.json').expo; console.log('Release config:', app.version, app.android.versionCode, app.android.package); if(app.android.versionCode<=25) throw new Error('versionCode inválido');"

      - name: Fast JS bundle validation
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: |
          rm -rf dist
          npx expo export --platform android --output-dir dist
          test -f dist/_expo/static/js/android/index-*.js || find dist -maxdepth 5 -type f | sort

      - name: Build production AAB on EAS
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: |
          set +e
          eas build \
            --platform android \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --clear-cache \
            --wait \
            --json > eas-build.json
          STATUS=$?
          cat eas-build.json || true
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::EAS remoto falhou. Abra o link de logs exibido acima e copie a primeira linha vermelha do passo que falhou."
            exit "$STATUS"
          fi
          ARTIFACT_URL=$(node -e "const fs=require('fs'); const raw=fs.readFileSync('eas-build.json','utf8').trim(); const start=raw.indexOf('['); const data=JSON.parse(raw.slice(start)); const build=Array.isArray(data)?data[0]:data; const url=build?.artifacts?.buildUrl||build?.artifacts?.applicationArchiveUrl; if(!url){console.error(raw); process.exit(1)}; process.stdout.write(url)")
          echo "artifact_url=$ARTIFACT_URL" >> "$GITHUB_OUTPUT"

      - name: Download generated AAB
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          AAB_NAME="Nexa-${VERSION_NAME}-versionCode-${VERSION_CODE}.aab"
          curl --fail --location "${{ steps.eas_build.outputs.artifact_url }}" --output "$AAB_NAME"
          ls -lh "$AAB_NAME"

      - name: Upload AAB to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-${{ inputs.version_name }}-versionCode-${{ inputs.version_code }}
          path: nexa-mobile/nexa-mobile/Nexa-${{ inputs.version_name }}-versionCode-${{ inputs.version_code }}.aab
          if-no-files-found: error
          retention-days: 30
