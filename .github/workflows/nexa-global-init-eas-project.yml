name: Nexa Global Initialize EAS Project

on:
  push:
    branches:
      - feat/nexa-global-v1
    paths:
      - '.github/workflows/nexa-global-init-eas-project.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_NEXA_RELEASE_CHANNEL: 'nexa-global'
    steps:
      - name: Checkout Global branch
        uses: actions/checkout@v5
        with:
          ref: feat/nexa-global-v1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Create or link dedicated Nexa Global EAS project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          if (app.expo?.extra?.eas) {
            delete app.expo.extra.eas.projectId;
          }
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          NODE

          eas init --account henrriquenexa --json --non-interactive > eas-init.json
          eas project:info --json > eas-project-info.json

          node <<'NODE'
          const fs = require('fs');
          const init = JSON.parse(fs.readFileSync('eas-init.json', 'utf8'));
          const info = JSON.parse(fs.readFileSync('eas-project-info.json', 'utf8'));
          const projectId =
            info?.id ||
            info?.projectId ||
            info?.project?.id ||
            init?.id ||
            init?.projectId ||
            init?.project?.id;
          const slug =
            info?.slug ||
            info?.project?.slug ||
            init?.slug ||
            init?.project?.slug;
          if (!projectId) throw new Error('Dedicated Nexa Global EAS project id was not returned');
          if (slug && slug !== 'nexa-global') {
            throw new Error('Unexpected EAS project slug: ' + slug);
          }

          const path = 'app.config.js';
          let source = fs.readFileSync(path, 'utf8');
          const marker = "        ...(config.extra || {}),\n        releaseChannel: 'nexa-global',";
          if (!source.includes(marker)) throw new Error('Global app config marker not found');

          const replacement =
            "        ...(config.extra || {}),\n" +
            "        eas: {\n" +
            "          ...((config.extra || {}).eas || {}),\n" +
            "          projectId: '" + projectId + "',\n" +
            "        },\n" +
            "        releaseChannel: 'nexa-global',";

          source = source.replace(marker, replacement);
          fs.writeFileSync(path, source);
          fs.writeFileSync('nexa-global-eas-project.json', JSON.stringify({
            slug: 'nexa-global',
            projectId,
          }, null, 2) + '\n');
          console.log('Dedicated Nexa Global EAS project linked.');
          NODE

          git checkout -- app.json
          rm -f eas-init.json eas-project-info.json

      - name: Validate Global EAS project isolation
        run: |
          set -euo pipefail
          node <<'NODE'
          process.env.EXPO_PUBLIC_NEXA_RELEASE_CHANNEL = 'nexa-global';
          const app = require('./app.json').expo;
          const dynamic = require('./app.config.js')({ config: app });
          const brazilId = app.extra?.eas?.projectId;
          const globalId = dynamic.extra?.eas?.projectId;
          if (!globalId) throw new Error('Global EAS project id missing');
          if (globalId === brazilId) throw new Error('Global still shares Brazil EAS project id');
          if (dynamic.slug !== 'nexa-global') throw new Error('Global slug mismatch');
          if (dynamic.android?.package !== 'com.trynexa.global') throw new Error('Global package mismatch');
          console.log('Global EAS project isolation validated.');
          NODE

      - name: Commit dedicated Global project binding
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.config.js nexa-global-eas-project.json
          git diff --cached --quiet && exit 0
          git commit -m "infra(global): isolate EAS project identity"
          git push origin HEAD:feat/nexa-global-v1
