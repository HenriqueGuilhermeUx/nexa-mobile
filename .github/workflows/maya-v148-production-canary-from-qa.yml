name: Maya v148 — verify current live Android release (read only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/maya-v148-production-canary-from-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Inspect exact Expo-live Android commit without releasing OTA
        uses: actions/checkout@v4
        with:
          ref: b8bc4c65f08480f2a334be457ef47bcc1b20f49d
      - name: Validate customer-visible Maya modules and protect existing features
        run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const app=JSON.parse(fs.readFileSync('app.json','utf8')).expo;
          assert.equal(app.version,'2.0.43');
          assert.equal(app.android.versionCode,148);
          assert.equal(app.android.package,'br.com.trynexa.app');
          assert.equal(app.runtimeVersion.policy,'appVersion');
          const layout=fs.readFileSync('app/_layout.tsx','utf8');
          const assistant=fs.readFileSync('src/components/NexaAssistantOpenFinance.tsx','utf8');
          const expected=['maya-hoje','maya-actions','maya-planning','maya-shopping','maya-comunicacao','maya-actions-financas'];
          for(const name of expected){
            assert.ok(fs.existsSync('app/'+name+'.tsx'),'Missing Maya function '+name);
            assert.ok(layout.includes('name="'+name+'"'),'Maya route not registered: '+name);
          }
          for(const label of ['Meu dia','Tarefas','Metas','Movimentações','Pesquisar','Mensagens'])
            assert.ok(assistant.includes(label),'Missing Maya action: '+label);
          assert.ok(fs.existsSync('app/(app)/external-wallets.tsx'),'External wallet screen disappeared');
          assert.ok(fs.existsSync('app/(app)/aave-info.tsx'),'Aave screen disappeared');
          console.log('LIVE_MAYA_SIX_MODULES_AND_EXISTING_WALLET_AAVE_SOURCE_PRESENT=true');
          NODE
      - name: Attest current live Expo Android OTA origin
        run: |
          node <<'NODE'
          (async()=>{
            if(!process.env.EXPO_TOKEN)throw Error('Missing EXPO_TOKEN');
            const q='query($appId:String!){app{byId(appId:$appId){updateChannelByName(name:"production"){updateBranches(offset:0,limit:10){name}} prod:updateBranchByName(name:"production"){updates(offset:0,limit:10){id gitCommitHash platform createdAt}}}}}';
            const res=await fetch('https://api.expo.dev/graphql',{
              method:'POST',headers:{Authorization:'Bearer '+process.env.EXPO_TOKEN,'Content-Type':'application/json'},
              body:JSON.stringify({query:q,variables:{appId:'b3faabec-283a-4ba2-88b5-f096304e68aa'}}),
              signal:AbortSignal.timeout(15000)
            });
            const j=await res.json();
            const app=j.data?.app?.byId;
            const names=app?.updateChannelByName?.updateBranches?.map(x=>x.name)||[];
            const live=app?.prod?.updates?.find(x=>x.platform==='android');
            if(!res.ok||j.errors?.length||names.length!==1||names[0]!=='production')
              throw Error('Expo production mapping unknown; audit blocked');
            if(live?.gitCommitHash!=='b8bc4c65f08480f2a334be457ef47bcc1b20f49d')
              throw Error('Live OTA advanced; inspect its exact commit before claiming Maya is live');
            const lines=['## Maya Android production — existing OTA verified',
              '- Live Android OTA id: '+live.id,
              '- Source commit: '+live.gitCommitHash,
              '- Maya modules present: six',
              '- Aave and external wallet screens preserved: YES',
              '- Production OTA published by this workflow: NO',
              ''];
            require('node:fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n'));
            console.log('EXISTING_MAYA_PRODUCTION_VERIFIED='+JSON.stringify(live));
          })().catch(e=>{console.error('AUDIT_BLOCKED: '+e.message);process.exitCode=1});
          NODE
