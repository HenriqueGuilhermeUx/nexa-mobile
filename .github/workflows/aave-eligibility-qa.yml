name: Aave isolated eligibility QA
on:
  push:
    branches:
      - feat/aave-qa-operation-eligibility-20261112
    paths:
      - 'app/(app)/aave-info.tsx'
      - 'src/lib/aaveReserveEligibility.ts'
      - 'scripts/validate-aave-eligibility.cjs'
      - '.github/workflows/aave-eligibility-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aave-eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED: 'false'
    steps:
      - name: Check out isolated Aave QA ref
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify isolated branch and no transaction execution
        run: |
          test "${GITHUB_REF_NAME}" = 'feat/aave-qa-operation-eligibility-20261112'
          node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('app/(app)/aave-info.tsx', 'utf8');
          const home = fs.readFileSync('src/components/AlignedLegacyApp.tsx', 'utf8');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          if (!source.includes('AaveInfoScreen') || !home.includes('Aave na Nexa')) throw Error('Aave navigation missing');
          if (!source.includes('aaveReserveEligibleForPlanning')) throw Error('QA eligibility helper not used');
          if (source.includes('walletClient.writeContract') || source.includes('sendTransaction(')) throw Error('Unexpected transaction execution in screen');
          if (app.expo.android.versionCode !== 148 || app.expo.version !== '2.0.43') throw Error('Unexpected production baseline');
          console.log('QA source boundary confirmed');
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run Aave QA regression matrix
        run: node scripts/validate-aave-eligibility.cjs
      - name: TypeScript check
        run: npm run typecheck
