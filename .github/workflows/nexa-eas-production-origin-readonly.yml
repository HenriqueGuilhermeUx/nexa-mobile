name: Nexa Android EAS production origin read-only audit
on:
  push:
    branches:
      - audit/nexa-ota-rewards-production-20261127
    paths:
      - .github/workflows/nexa-eas-production-origin-readonly.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Query Expo production channel and exact latest Android OTA source, never publish
        run: |
          node <<'NODE'
          (async () => {
            const token = process.env.EXPO_TOKEN;
            if (!token) throw new Error('Expo inventory token missing');
            const query = 'query($appId:String!){app{byId(appId:$appId){updateChannelByName(name:"production"){updateBranches(offset:0,limit:10){name}} prod:updateBranchByName(name:"production"){updates(offset:0,limit:15){id gitCommitHash platform group createdAt}} qa:updateBranchByName(name:"maya-v148-agentics-pinned-qa"){updates(offset:0,limit:5){id gitCommitHash platform group createdAt}}}}}';
            const resp = await fetch('https://api.expo.dev/graphql',{
              method: 'POST',
              headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query, variables: { appId: 'b3faabec-283a-4ba2-88b5-f096304e68aa' } }),
              signal: AbortSignal.timeout(20000),
            });
            const result = await resp.json();
            if (!resp.ok || result.errors?.length) throw new Error('EAS read-only provenance query failed');
            const app = result.data?.app?.byId;
            const channelBranches = app?.updateChannelByName?.updateBranches?.map(x => x.name) || [];
            if (channelBranches.length !== 1 || channelBranches[0] !== 'production')
              throw new Error('Production channel must map only to Expo production branch');
            const android = app.prod?.updates?.find(x => x.platform === 'android');
            if (!android?.id || !/^[a-f\d]{40}$/i.test(android.gitCommitHash || ''))
              throw new Error('Could not verify exact production Android OTA source commit');
            console.log('EXPO_LIVE_ANDROID_SOURCE=' + android.gitCommitHash);
            console.log('EXPO_LIVE_ANDROID_UPDATE_ID=' + android.id);
            console.log('EXPO_LIVE_ANDROID_PUBLISHED_AT=' + android.createdAt);
            console.log('EXPO_PRODUCTION_CHANNEL_BRANCH=' + channelBranches[0]);
            const qa = app.qa?.updates?.find(x => x.platform === 'android');
            if (qa) console.log('EXPO_RECENT_MAYA_QA_SOURCE=' + qa.gitCommitHash);
            console.log('READ_ONLY_NO_FINANCIAL_ACTIONS_NO_OTA=true');
          })().catch(err => {console.error('AUDIT_FAILED: ' + err.message); process.exitCode = 1});
          NODE
