name: Nexa Assistant Production AAB

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nexa-assistant-aab
    paths:
      - '.github/workflows/assistant-production-aab.yml'
      - 'eas.json'
      - 'app.config.js'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'app/**'
      - 'src/**'

permissions:
  contents: read
  statuses: write

concurrency:
  group: nexa-assistant-production-aab
  cancel-in-progress: true

jobs:
  build:
    name: Signed production-safe Assistant AAB
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout AAB branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Mark AAB build pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'nexa-assistant-production-aab',
              description: 'Building verified Nexa Assistant AAB',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Assert AAB branch only adds build packaging
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/nexa-personal-assistant --depth=1
          CHANGED=$(git diff --name-only origin/feature/nexa-personal-assistant...HEAD)
          echo "$CHANGED"
          UNEXPECTED=$(printf '%s\n' "$CHANGED" | grep -Ev '^(eas\.json|\.github/workflows/assistant-production-aab\.yml)$' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo 'Unexpected product files changed in AAB packaging branch:'
            echo "$UNEXPECTED"
            exit 1
          fi
          echo 'AAB branch contains packaging changes only.'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || (echo 'EXPO_TOKEN ausente' && exit 1)
          eas whoami

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Preflight production backend
        run: |
          set -euo pipefail
          API='https://nexa-backend-p2u0.onrender.com/api/v1'
          curl --fail --silent --show-error --retry 8 --retry-delay 10 --max-time 20 "$API/health" -o prod-health.json
          node <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('prod-health.json', 'utf8'));
          if (String(health.status || '').toLowerCase() !== 'ok') throw new Error('Production health is not OK');
          console.log('Production backend health OK.');
          NODE

      - name: Assert AAB production-safe profile
        run: |
          set -euo pipefail
          node <<'NODE'
          const eas = require('./eas.json');
          const p = eas?.build?.['production-assistant-aab'];
          if (!p) throw new Error('production-assistant-aab profile missing');
          if (p.android?.buildType !== 'app-bundle') throw new Error('AAB profile must build app-bundle');
          if (p.env?.EXPO_PUBLIC_NEXA_API_URL !== 'https://nexa-backend-p2u0.onrender.com/api/v1') throw new Error('AAB must use production backend');
          if (p.env?.EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED !== 'false') throw new Error('Financial execution must remain disabled');
          if (p.env?.EXPO_PUBLIC_NEXA_ASSISTANT_ENABLED !== 'true') throw new Error('Assistant must be enabled');
          console.log('AAB profile OK: app-bundle, production backend, assistant ON, financial execution OFF.');
          NODE

      - name: Validate release identity and notification contracts
        env:
          EXPO_PUBLIC_NEXA_API_URL: 'https://nexa-backend-p2u0.onrender.com/api/v1'
          EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED: 'false'
          EXPO_PUBLIC_NEXA_ASSISTANT_ENABLED: 'true'
          EXPO_PUBLIC_NEXA_RELEASE_CHANNEL: 'production-assistant-aab'
        run: |
          set -euo pipefail
          npx expo config --type public --json > expo-public-config.json
          node <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('expo-public-config.json', 'utf8'));
          if (c.name !== 'Nexa') throw new Error('Unexpected app name');
          if (c.android?.package !== 'br.com.trynexa.app') throw new Error('Unexpected Android package');
          if (c.version !== '2.0.12') throw new Error(`Unexpected version ${c.version}`);
          if (Number(c.android?.versionCode) !== 107) throw new Error(`Unexpected versionCode ${c.android?.versionCode}`);
          const plugins = JSON.stringify(c.plugins || []);
          if (!plugins.includes('expo-notifications')) throw new Error('expo-notifications plugin missing');
          if (!plugins.includes('expo-speech-recognition')) throw new Error('speech recognition plugin missing');
          console.log('Release identity OK: Nexa 2.0.12 v107 / br.com.trynexa.app.');
          NODE
          grep -q 'expo-notifications' package.json
          grep -q 'Lembretes Nexa' src/lib/nexaNotifications.ts
          grep -q 'ensureNexaNotificationPermission' app/assistant.tsx
          grep -q 'ExpoSpeechRecognitionModule' src/components/NexaAssistant.tsx

      - name: Validate mobile safety contracts
        run: node scripts/validate-mobile-safety.js

      - name: Validate release assets
        run: node scripts/validate-release-assets.js

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Export Android bundle
        env:
          CI: 'true'
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_NEXA_API_URL: 'https://nexa-backend-p2u0.onrender.com/api/v1'
          EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED: 'false'
          EXPO_PUBLIC_NEXA_ASSISTANT_ENABLED: 'true'
          EXPO_PUBLIC_NEXA_RELEASE_CHANNEL: 'production-assistant-aab'
        run: npm run export:android

      - name: Build signed production-safe AAB
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: 'true'
          NODE_ENV: 'production'
          EXPO_NO_TELEMETRY: '1'
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
          EAS_LOCAL_BUILD_SKIP_CLEANUP: '1'
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/nexa-assistant-aab
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/local-build-artifacts-assistant-aab
        run: |
          set -euo pipefail
          FILE='Nexa-Assistant-2.0.12-v107.aab'
          rm -f "$FILE"
          eas build --platform android --profile production-assistant-aab --local --non-interactive --output "$GITHUB_WORKSPACE/$FILE"
          test -s "$FILE"
          SHA256=$(sha256sum "$FILE" | awk '{print $1}')
          echo "aab_file=$FILE" >> "$GITHUB_ENV"
          echo "aab_sha256=$SHA256" >> "$GITHUB_ENV"
          ls -lh "$FILE"

      - name: Verify AAB signature and archive structure
        run: |
          set -euo pipefail
          jarsigner -verify -verbose -certs "${{ env.aab_file }}" > aab-signature.txt
          grep -q 'jar verified' aab-signature.txt
          unzip -l "${{ env.aab_file }}" > aab-contents.txt
          grep -q 'base/manifest/AndroidManifest.xml' aab-contents.txt
          grep -q 'base/dex/classes.dex' aab-contents.txt
          printf '%s  %s\n' "${{ env.aab_sha256 }}" "${{ env.aab_file }}" > SHA256SUMS.txt
          echo 'AAB VERIFIED: signed bundle archive with base manifest/dex present.'

      - name: Upload verified AAB
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-Assistant-2.0.12-v107-AAB-VERIFIED
          path: |
            ${{ env.aab_file }}
            SHA256SUMS.txt
            aab-signature.txt
            aab-contents.txt
            expo-public-config.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-Assistant-AAB-build-diagnostics
          path: |
            ${{ runner.temp }}/nexa-assistant-aab/logs
            local-build-artifacts-assistant-aab
          if-no-files-found: warn
          retention-days: 14

      - name: Publish AAB build status
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ job.status }}';
            const state = outcome === 'success' ? 'success' : outcome === 'cancelled' ? 'error' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'nexa-assistant-production-aab',
              description: state === 'success' ? 'Verified Nexa Assistant AAB built' : `Assistant AAB build ${outcome}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
