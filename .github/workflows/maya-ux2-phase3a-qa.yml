name: Maya UX2 Phase3A — QA inline review cards Android
on:
  push:
    branches: [release/maya-ux2-phase3a-action-cards-v148-20261115]
    paths: ['.github/workflows/maya-ux2-phase3a-qa.yml']
permissions:
  contents: read
concurrency:
  group: nexa-maya-ux2-phase3a-qa
  cancel-in-progress: false
jobs:
  test-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Confirm only additive UI on already published Phase1
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 191bc32958ef40c7bc217babf781f3172f89c415 HEAD
          node - <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process');
          const allowed=['src/components/NexaAssistantOpenFinance.tsx','scripts/validate-maya-action-cards-v1.js','.github/workflows/maya-ux2-phase3a-qa.yml'];
          const changed=cp.execFileSync('git',['diff','--name-only','191bc32958ef40c7bc217babf781f3172f89c415','HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          if(changed.some(x=>!allowed.includes(x)))throw Error('Non-UI changes: '+changed.join(','));
          const app=JSON.parse(fs.readFileSync('app.json','utf8')).expo;
          if(app.version!=='2.0.43'||app.android.versionCode!==148||app.android.package!=='br.com.trynexa.app')throw Error('Native app identity changed');
          const today=fs.readFileSync('app/maya-hoje.tsx','utf8');
          if(today.includes('AsyncStorage.setItem')||today.includes('sendTransaction('))throw Error('Today must be read-only');
          console.log('PHASE3A_JS_ONLY='+JSON.stringify(changed));
          NODE
      - run: npm ci --no-audit --no-fund
      - name: Full regression on cumulative Phase2 plus action review
        run: |
          set -euo pipefail
          node scripts/validate-maya-action-cards-v1.js
          node scripts/validate-maya-hoje-v1.js
          node scripts/validate-mobile-safety-v123.js
          node scripts/validate-central-nexa-v148.js
          node scripts/validate-central-nexa-push-optin-v148.js
          for f in scripts/validate-maya-actions-v1.js scripts/validate-maya-actions-agenda-v1.js scripts/validate-maya-chat-routing-v1.js scripts/validate-maya-comunicacao-v1.js scripts/validate-maya-financas-leitura-v1.js scripts/validate-maya-planning-v1.js scripts/validate-maya-shopping-v1.js; do node "$f"; done
          npm run typecheck
          npm run export:android
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 27.9.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Confirm Phase2 still latest in production before staging QA
        run: |
          node - <<'NODE'
          (async()=>{
            const q='query($appId:String!){app{byId(appId:$appId){updateChannelByName(name:"production"){updateBranches(offset:0,limit:10){name}} prod:updateBranchByName(name:"production"){updates(offset:0,limit:5){id group gitCommitHash platform}}}}}';
            const res=await fetch('https://api.expo.dev/graphql',{method:'POST',headers:{Authorization:'Bearer '+process.env.EXPO_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({query:q,variables:{appId:'b3faabec-283a-4ba2-88b5-f096304e68aa'}}),signal:AbortSignal.timeout(15000)});
            const j=await res.json();if(!res.ok||j.errors?.length)throw Error('Inventory unavailable');
            const a=j.data?.app?.byId,m=a?.updateChannelByName?.updateBranches?.map(x=>x.name)||[],prod=a?.prod?.updates?.find(x=>x.platform==='android');
            if(m.length!==1||m[0]!=='production'||prod?.id!=='01a1e16c-8865-7c97-bead-f448ab6d0398'||prod?.gitCommitHash!=='191bc32958ef40c7bc217babf781f3172f89c415')throw Error('Production changed since Phase2: rebase required');
            console.log('PRODUCTION_PHASE2_STILL_LIVE='+JSON.stringify(prod));
          })().catch(e=>{console.error('BLOCK:'+e.message);process.exitCode=1});
          NODE
      - name: Prepare additive Phase3A Android QA only
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),env=JSON.parse(fs.readFileSync('eas.json','utf8')).build.production.env;
          for(const [k,v] of Object.entries(env))if(/^EXPO_PUBLIC_[A-Z0-9_]+$/.test(k)&&typeof v==='string')fs.appendFileSync(process.env.GITHUB_ENV,k+'='+v+'\n');
          NODE
      - name: Publish immutable QA bundle for Meu dia
        run: eas update --branch maya-ux2-phase3a-qa --platform android --message "Maya UX2 Phase3A review cards additive on Phase1 $(git rev-parse --short HEAD)" --non-interactive
