name: Connect custody screen to production App.js

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-custody-screen.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch the production Expo App.js
        shell: python
        run: |
          from pathlib import Path

          path = Path('nexa-mobile/nexa-mobile/App.js')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Anchor not found: {label}')
              text = text.replace(old, new, 1)

          replace_once(
              "import QRCode from 'react-native-qrcode-svg';",
              "import QRCode from 'react-native-qrcode-svg';\nimport CustodyScreen from './CustodyScreen';",
              'custody import',
          )

          # Switch the published app to the complete portfolio balance.
          text = text.replace("&limit=50&mode=real", "&limit=50&mode=portfolio")
          text = text.replace("&mode=real'", "&mode=portfolio&_=' + Date.now()")

          # Add the definitive custody page before the home page.
          home_anchor = """        {/* ABA 1: HOME (ULTRA LIMPA) */}
        {page === 'home' && (
"""
          custody_page = """        {page === 'custody' && (
          <CustodyScreen
            user={user}
            token={token}
            onBack={function () { setPage('home'); }}
            onBalanceRefresh={carregarDados}
          />
        )}

        {/* ABA 1: HOME (ULTRA LIMPA) */}
        {page === 'home' && (
"""
          replace_once(home_anchor, custody_page, 'custody page')

          # Put the access card at the top of the authenticated home screen.
          fragment_anchor = """        {page === 'home' && (
          <>
            <Card>
"""
          fragment_new = """        {page === 'home' && (
          <>
            <TouchableOpacity
              style={{
                backgroundColor: '#0f172a',
                borderWidth: 1,
                borderColor: '#2563eb',
                borderRadius: 18,
                padding: 16,
                marginBottom: 14,
              }}
              onPress={function () { setPage('custody'); }}
            >
              <Text style={{ color: '#fff', fontSize: 18, fontWeight: '900' }}>
                Custódia Inteligente Nexa™
              </Text>
              <Text style={{ color: '#94a3b8', marginTop: 5, lineHeight: 19 }}>
                Alterne entre Modo Nexa e Carteira Própria. Veja seus saldos, endereço Polygon e movimente USDC.
              </Text>
              <Text style={{ color: '#60a5fa', fontWeight: '800', marginTop: 10 }}>
                Abrir centro de custódia →
              </Text>
            </TouchableOpacity>

            <Card>
"""
          replace_once(fragment_anchor, fragment_new, 'home custody card')

          path.write_text(text)

      - name: Commit production mobile integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nexa-mobile/nexa-mobile/App.js nexa-mobile/nexa-mobile/CustodyScreen.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add Custódia Inteligente to production mobile app"
            git push
          fi
