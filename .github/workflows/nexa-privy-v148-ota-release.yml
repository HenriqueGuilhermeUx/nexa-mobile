name: Nexa v148 Privy wallet activation OTA
on:
  push:
    branches:
      - release/nexa-v148-privy-activation-hotfix-20261119
  pull_request:
    branches:
      - release/central-nexa-v148-ota-safe-20261112
permissions:
  contents: read
concurrency:
  # Pull-request validation must not evict the push-triggered EAS QA release.
  group: nexa-v148-privy-ota-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_NEXA_API_URL: https://nexa-backend-p2u0.onrender.com/api/v1
      EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Exact production-native baseline and allowable JS-only changes
        run: node scripts/validate-privy-v148-hotfix.cjs
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run export:android
  qa-ota:
    if: "github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'release(privy): qa-only') || startsWith(github.event.head_commit.message, 'release(privy): canary-10'))"
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_NEXA_API_URL: https://nexa-backend-p2u0.onrender.com/api/v1
      EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED: 'false'
      EXPO_PUBLIC_NEXA_RELEASE_CHANNEL: nexa-privy-v148-qa
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: test -n "$EXPO_TOKEN"
      - run: npm ci --no-audit --no-fund
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 27.9.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish ONLY to isolated EAS QA branch
        run: eas update --branch nexa-privy-v148-qa --platform android --message "Nexa v148 Privy QA SHA ${{ github.sha }}" --non-interactive
  production-canary:
    if: "github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release(privy): canary-10')"
    needs: [validate, qa-ota]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: test -n "$EXPO_TOKEN"
      - name: Load original production build's public environment
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const env=JSON.parse(fs.readFileSync('eas.json','utf8')).build.production.env;
          for(const [key,value] of Object.entries(env)){
            if(!/^EXPO_PUBLIC_[A-Z0-9_]+$/.test(key)||typeof value!=='string')
              throw Error('Unexpected environment key/value');
            fs.appendFileSync(process.env.GITHUB_ENV,key+'='+value+'\n');
          }
          NODE
      - run: npm ci --no-audit --no-fund
      - run: node scripts/validate-privy-v148-hotfix.cjs
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 27.9.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Verify live production SHA and identical QA candidate before publishing
        run: |
          node - <<'NODE'
          (async()=>{
            const query='query($appId:String!){app{byId(appId:$appId){updateChannelByName(name:"production"){updateBranches(offset:0,limit:10){name}} prod:updateBranchByName(name:"production"){updates(offset:0,limit:10){id gitCommitHash platform group}} qa:updateBranchByName(name:"nexa-privy-v148-qa"){updates(offset:0,limit:10){id gitCommitHash platform group}}}}}';
            const r=await fetch('https://api.expo.dev/graphql',{
              method:'POST',headers:{Authorization:'Bearer '+process.env.EXPO_TOKEN,'Content-Type':'application/json'},
              body:JSON.stringify({query,variables:{appId:'b3faabec-283a-4ba2-88b5-f096304e68aa'}}),
              signal:AbortSignal.timeout(15000)
            });
            const data=await r.json();
            if(!r.ok||data.errors?.length)throw Error('EAS evidence unavailable');
            const app=data.data?.app?.byId;
            const mapped=app?.updateChannelByName?.updateBranches?.map(x=>x.name)||[];
            if(mapped.length!==1||mapped[0]!=='production')
              throw Error('Production channel mapping changed');
            const live=app?.prod?.updates?.find(x=>x.platform==='android');
            if(live?.gitCommitHash!=='72f2b82241eae43bda20a33c03758680787a613e')
              throw Error('Production update differs from verified v148 baseline: stop');
            const qa=app?.qa?.updates?.find(x=>x.platform==='android');
            if(qa?.gitCommitHash!==process.env.GITHUB_SHA)
              throw Error('QA update did not match exact candidate SHA: stop');
            console.log('V148_PRIVY_CANARY_PREFLIGHT_OK, baseline and QA confirmed; no funds moved');
          })().catch(e=>{console.error('FAIL_CLOSED: '+e.message);process.exitCode=1});
          NODE
      - name: Publish 10-percent canary Android only (never iOS)
        run: eas update --branch production --platform android --rollout-percentage 10 --message "Nexa v148 Privy hotfix 10 percent SHA ${{ github.sha }}" --non-interactive

  expo-source-audit:
    if: "github.event_name == 'push' && startsWith(github.event.head_commit.message, 'audit(privy):')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Read-only production/QA EAS source inventory
        shell: bash
        run: |
          node - <<'NODE'
          (async()=>{
            if(!process.env.EXPO_TOKEN)throw Error('Expo token unavailable');
            const query='query($appId:String!){app{byId(appId:$appId){updateChannelByName(name:"production"){name updateBranches(offset:0,limit:10){name}} prod:updateBranchByName(name:"production"){updates(offset:0,limit:12){id gitCommitHash platform group createdAt}} qa:updateBranchByName(name:"nexa-privy-v148-qa"){updates(offset:0,limit:5){id gitCommitHash platform group createdAt}}}}}';
            const response=await fetch('https://api.expo.dev/graphql',{method:'POST',
              headers:{Authorization:'Bearer '+process.env.EXPO_TOKEN,'Content-Type':'application/json'},
              body:JSON.stringify({query,variables:{appId:'b3faabec-283a-4ba2-88b5-f096304e68aa'}}),
              signal:AbortSignal.timeout(15000)});
            const data=await response.json();
            if(!response.ok||data.errors?.length)throw Error('EAS read-only audit failed');
            const app=data.data?.app?.byId;
            if(!app)throw Error('EAS project unavailable');
            const mapped=app.updateChannelByName?.updateBranches?.map(x=>x.name)||[];
            const android=app.prod?.updates?.filter(x=>x.platform==='android')||[];
            const qa=app.qa?.updates?.filter(x=>x.platform==='android')||[];
            console.log('EAS_SOURCE_AUDIT='+JSON.stringify({mapped,liveAndroid:android.slice(0,5),
              latestQaAndroid:qa.slice(0,2)}));
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
