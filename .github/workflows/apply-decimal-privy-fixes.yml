name: Apply decimal and Privy fixes

on:
  push:
    branches:
      - agent/fix-decimal-pix-withdrawal
    paths:
      - .github/workflows/apply-decimal-privy-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-decimal-pix-withdrawal
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch mobile sources
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(path, oldText, newText, label) {
            const source = fs.readFileSync(path, 'utf8');
            if (source.includes(newText)) return;
            if (!source.includes(oldText)) {
              throw new Error(`Anchor not found for ${label} in ${path}`);
            }
            fs.writeFileSync(path, source.replace(oldText, newText));
          }

          function replaceOptional(path, oldText, newText) {
            const source = fs.readFileSync(path, 'utf8');
            if (source.includes(newText)) return;
            if (source.includes(oldText)) {
              fs.writeFileSync(path, source.replace(oldText, newText));
            }
          }

          const legacyParser = `  function parseAmount(value) {
            const text = String(value || '').trim();
            if (!text) return 0;
            const clean = text
              .replace(/\\s/g, '')
              .replace(/R\\$/gi, '')
              .replace(/USDC/gi, '')
              .replace(/\\./g, '')
              .replace(',', '.');
            const number = Number(clean);
            if (!Number.isFinite(number)) return 0;
            return number;
          }`;

          const fixedLegacyParser = `  function parseAmount(value) {
            const text = String(value || '')
              .trim()
              .replace(/\\s/g, '')
              .replace(/R\\$/gi, '')
              .replace(/USDC/gi, '');
            if (!text) return 0;

            const lastComma = text.lastIndexOf(',');
            const lastDot = text.lastIndexOf('.');
            let normalized = text;

            if (lastComma >= 0 && lastDot >= 0) {
              const decimalSeparator = lastComma > lastDot ? ',' : '.';
              const thousandsSeparator = decimalSeparator === ',' ? '.' : ',';
              normalized = text.split(thousandsSeparator).join('');
              if (decimalSeparator === ',') normalized = normalized.replace(',', '.');
            } else if (lastComma >= 0) {
              normalized = text.replace(/\\./g, '').replace(',', '.');
            } else if (lastDot >= 0) {
              const dotCount = (text.match(/\\./g) || []).length;
              normalized =
                dotCount === 1 ? text : text.replace(/\\.(?=.*\\.)/g, '');
            }

            const number = Number(normalized);
            if (!Number.isFinite(number)) return 0;
            return number;
          }

          function formatInputAmount(value) {
            const number = Number(value || 0);
            if (!Number.isFinite(number)) return '';
            return number
              .toFixed(8)
              .replace(/0+$/, '')
              .replace(/\\.$/, '')
              .replace('.', ',');
          }`;

          const legacyFiles = ['App.js', 'nexa-mobile/nexa-mobile/App.js'];
          for (const path of legacyFiles) {
            replaceOnce(path, legacyParser, fixedLegacyParser, 'legacy amount parser');
            replaceOptional(
              path,
              `setValorUsdc(Number(saldo.USDC || 0).toFixed(6));`,
              `setValorUsdc(formatInputAmount(saldo.USDC));`,
            );

            const registrationStart = `  async function cadastrar() {
            if (!email || !password || !fullName || !cpf || !phone) {
              show('Preencha todos os campos do cadastro');
              return;
            }
            try {`;
            const fixedRegistrationStart = `  async function cadastrar() {
            const normalizedEmail = String(email || '').trim().toLowerCase();
            const duplicatedProviderDomain = /@((?:gmail|hotmail|outlook|yahoo|icloud)\\.com)\\1$/i.test(
              normalizedEmail,
            );
            const duplicatedCom = /\\.com\\.com$/i.test(normalizedEmail);
            const basicEmailValid = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test(
              normalizedEmail,
            );

            if (!normalizedEmail || !password || !fullName || !cpf || !phone) {
              show('Preencha todos os campos do cadastro');
              return;
            }
            if (!basicEmailValid || duplicatedProviderDomain || duplicatedCom) {
              show('Confira o e-mail. Ele parece digitado incorretamente.');
              return;
            }
            try {`;
            replaceOnce(path, registrationStart, fixedRegistrationStart, 'legacy registration validation');
            replaceOptional(
              path,
              `body: JSON.stringify({ email, password, cpf, fullName, phone }),`,
              `body: JSON.stringify({ email: normalizedEmail, password, cpf, fullName, phone }),`,
            );
          }

          const orderPath = 'app/(app)/new-order.tsx';
          const orderParser = `function parseAmount(value: string) {
            const trimmed = value.trim().replace(/R\\$/gi, '').replace(/\\s/g, '');
            return Number(
              trimmed.includes(',')
                ? trimmed.replace(/\\./g, '').replace(',', '.')
                : trimmed,
            );
          }`;
          const fixedOrderParser = `function parseAmount(value: string) {
            const text = value.trim().replace(/R\\$/gi, '').replace(/\\s/g, '');
            if (!text) return 0;

            const lastComma = text.lastIndexOf(',');
            const lastDot = text.lastIndexOf('.');
            let normalized = text;

            if (lastComma >= 0 && lastDot >= 0) {
              const decimalSeparator = lastComma > lastDot ? ',' : '.';
              const thousandsSeparator = decimalSeparator === ',' ? '.' : ',';
              normalized = text.split(thousandsSeparator).join('');
              if (decimalSeparator === ',') normalized = normalized.replace(',', '.');
            } else if (lastComma >= 0) {
              normalized = text.replace(/\\./g, '').replace(',', '.');
            } else if (lastDot >= 0) {
              const dotCount = (text.match(/\\./g) || []).length;
              normalized =
                dotCount === 1 ? text : text.replace(/\\.(?=.*\\.)/g, '');
            }

            const number = Number(normalized);
            return Number.isFinite(number) ? number : 0;
          }`;
          replaceOnce(orderPath, orderParser, fixedOrderParser, 'official amount parser');

          const onboardingPath = 'app/onboarding-wallet.tsx';
          const blockingAudit = `      await nexaApi.linkWallet(session.accessToken, privyAccessToken, {
                privyWalletId,
                walletAddress: wallet.address,
              });
              await nexaApi.auditWallet(session.accessToken);
              const updated = await nexaApi.directProfile(session.accessToken);
              setProfile(valueFromProfile(updated));
              router.replace('/(app)');`;
          const nonBlockingAudit = `      await nexaApi.linkWallet(session.accessToken, privyAccessToken, {
                privyWalletId,
                walletAddress: wallet.address,
              });

              const walletLinkSucceeded = true;
              try {
                await nexaApi.auditWallet(session.accessToken);
              } catch (auditError) {
                console.warn(
                  'A carteira foi vinculada, mas a auditoria complementar ficou pendente.',
                  auditError instanceof Error ? auditError.message : auditError,
                );
              }

              const updated = await nexaApi.directProfile(session.accessToken);
              setProfile(valueFromProfile(updated));
              if (walletLinkSucceeded) router.replace('/(app)');`;
          replaceOnce(onboardingPath, blockingAudit, nonBlockingAudit, 'non-blocking Privy audit');

          const ciPath = '.github/workflows/mobile-ci.yml';
          const ciAnchor = `      - name: Validate Android release assets
                run: node scripts/validate-release-assets.js
              - name: Validate TypeScript`;
          const ciReplacement = `      - name: Validate Android release assets
                run: node scripts/validate-release-assets.js
              - name: Validate decimal and Privy onboarding fixes
                run: node scripts/validate-decimal-and-privy-onboarding.js
              - name: Validate TypeScript`;
          replaceOnce(ciPath, ciAnchor, ciReplacement, 'mobile CI validation');
          NODE

      - name: Validate source patch
        run: node scripts/validate-decimal-and-privy-onboarding.js

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.js nexa-mobile/nexa-mobile/App.js app/onboarding-wallet.tsx 'app/(app)/new-order.tsx' .github/workflows/mobile-ci.yml
          if git diff --cached --quiet; then
            echo "No source changes required"
          else
            git commit -m "Fix decimal inputs and make Privy audit non-blocking"
            git push origin HEAD:agent/fix-decimal-pix-withdrawal
          fi
