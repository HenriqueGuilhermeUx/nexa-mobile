name: Refresh Expo 57 lockfile for v148
on:
  push:
    branches:
      - fix/legacy-wallet-access-v148-20261015
    paths:
      - package.json
      - .github/workflows/refresh-expo57-lock-v148.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.0'
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean installation and regression
        run: |
          npm ci --no-audit --no-fund
          npm run test:legacy-routing
          npx expo-doctor
      - name: Commit refreshed lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(v148): refresh Expo 57 lockfile"
            git push
          fi
