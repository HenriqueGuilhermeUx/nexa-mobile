name: Nexa Wallet-First v129 Launch Candidate APK

on:
  push:
    branches:
      - fix/rewards-privy-reauth-v129
    paths:
      - 'app/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'app.config.js'
      - 'eas.json'
      - '.github/build-triggers/launch-v129.txt'
      - '.github/workflows/wallet-first-v129-launch-candidate-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexa-wallet-first-v129-launch-candidate-apk
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build Nexa v129 launch candidate APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: 24.8.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Verify v129 release identity and safety
        run: |
          set -euo pipefail
          node <<'NODE'
          const app = require('./app.json').expo;
          const dynamic = require('./app.config.js')({ config: app });
          const pkg = require('./package.json');
          const expectedRelease = 'android16-api36-2.0.28-v129-launch-candidate-gold-card-rewards';
          if (app.version !== '2.0.28') throw new Error(`Unexpected app version ${app.version}`);
          if (pkg.version !== '2.0.28') throw new Error(`Unexpected package version ${pkg.version}`);
          if (Number(app.android?.versionCode) !== 129) throw new Error(`Unexpected app.json versionCode ${app.android?.versionCode}`);
          if (String(app.ios?.buildNumber) !== '129') throw new Error(`Unexpected app.json iOS build ${app.ios?.buildNumber}`);
          if (dynamic.version !== '2.0.28') throw new Error(`Unexpected dynamic version ${dynamic.version}`);
          if (Number(dynamic.android?.versionCode) !== 129) throw new Error(`Unexpected dynamic versionCode ${dynamic.android?.versionCode}`);
          if (String(dynamic.ios?.buildNumber) !== '129') throw new Error(`Unexpected dynamic iOS build ${dynamic.ios?.buildNumber}`);
          if (dynamic.extra?.releaseBuild !== expectedRelease) throw new Error(`Unexpected releaseBuild ${dynamic.extra?.releaseBuild}`);
          if (app.android?.package !== 'br.com.trynexa.app') throw new Error(`Unexpected package ${app.android?.package}`);
          if (app.runtimeVersion?.policy !== 'appVersion') throw new Error('runtimeVersion policy must remain appVersion');
          if (app.extra?.financialExecutionEnabled !== false) throw new Error('financialExecutionEnabled must remain false in launch-candidate binary');
          if (pkg.dependencies?.['@alchemy/wallet-apis'] !== '5.2.7') throw new Error('Alchemy Wallet APIs must remain pinned to 5.2.7');
          if (pkg.dependencies?.['@privy-io/expo'] !== '0.70.4') throw new Error('Privy Expo SDK must remain pinned to 0.70.4');
          if (pkg.dependencies?.viem !== '2.55.5') throw new Error('viem must remain pinned to 2.55.5');
          console.log('Nexa v129 launch candidate identity and safety OK.');
          NODE
          echo 'EXPECTED_VERSION=2.0.28' >> "$GITHUB_ENV"
          echo 'EXPECTED_BUILD=129' >> "$GITHUB_ENV"

      - name: Validate Rewards reauthentication and financial state machine
        run: |
          set -euo pipefail
          REWARDS='app/(app)/rewards.tsx'
          SESSION='app/wallet-session.tsx'
          ACTIONS='src/lib/rewardsActions.ts'
          test -f "$REWARDS"
          test -f "$SESSION"
          test -f "$ACTIONS"
          grep -q "pathname: '/wallet-session'" "$REWARDS"
          grep -q "returnTo: 'rewards'" "$REWARDS"
          grep -q 'disableSignup: true' "$SESSION"
          grep -q 'getAccessToken' "$SESSION"
          grep -q "router.replace('/(app)/rewards'" "$SESSION"
          grep -q "type: 'bridge' | 'deposit' | 'withdraw' | 'return'" "$REWARDS"
          grep -q "nextRequestStarted?: 'deposit' | 'return'" "$REWARDS"
          grep -q 'returnRewardsToWallet' "$REWARDS"
          grep -q 'startReturnToWallet' "$REWARDS"
          grep -q 'Não repita antes de verificarmos esta action' "$REWARDS"
          grep -q "'/rewards/v2/bridge-to-base'" "$ACTIONS"
          grep -q "'/rewards/v2/deposit'" "$ACTIONS"
          grep -q "'/rewards/v2/withdraw'" "$ACTIONS"
          grep -q "'/rewards/v2/return-to-wallet'" "$ACTIONS"
          grep -q 'x-privy-user-jwt' "$ACTIONS"
          if grep -q 'Resgate confirmado na sua carteira' "$REWARDS"; then
            echo 'Premature withdrawal success copy is still present.'
            exit 1
          fi
          echo 'Rewards reauth and bridge/deposit/withdraw/return contracts validated.'

      - name: Validate Premium Gold launch contract
        run: |
          set -euo pipefail
          BUY='app/(app)/buy-crypto.tsx'
          ACTIONS='src/lib/walletFirstActions.ts'
          grep -q "type Asset = 'BTC' | 'ETH' | 'PAXG'" "$BUY"
          grep -q "label: 'OURO'" "$BUY"
          grep -q 'getPremiumGoldQuote' "$BUY"
          grep -q 'preparePremiumGoldPurchase' "$BUY"
          grep -q 'getPremiumGoldSponsorshipCredentials' "$BUY"
          grep -q 'confirmPremiumGoldPurchase' "$BUY"
          grep -q "'/wallet-v15/gold/quote'" "$ACTIONS"
          grep -q "'/wallet-v15/gold/prepare'" "$ACTIONS"
          grep -q "'/wallet-v15/gold/client-sponsorship-credentials'" "$ACTIONS"
          grep -q "'/wallet-v15/gold/confirm'" "$ACTIONS"
          grep -q 'originTxHash' "$ACTIONS"
          grep -q 'não concluirá quando o PAXG for confirmado\|só concluirá quando o PAXG for confirmado' "$BUY"
          echo 'Premium Gold/PAXG client-sponsored cross-chain contract validated.'

      - name: Validate card and digital-wallet funding launch surface
        run: |
          set -euo pipefail
          FUND='app/(app)/fund-card.tsx'
          ORDER='app/(app)/new-order.tsx'
          grep -q 'useFundWallet' "$FUND"
          grep -q "asset: 'USDC'" "$FUND"
          grep -q "defaultPaymentMethod: 'card'" "$FUND"
          grep -q 'chain: polygon' "$FUND"
          grep -q 'Cartão, Apple Pay ou Google Pay' "$FUND"
          grep -q "router.push('/(app)/fund-card'" "$ORDER"
          echo 'Card / Apple Pay / Google Pay funding surface validated.'

      - name: Validate existing Wallet-First safety contracts
        run: |
          set -euo pipefail
          node scripts/validate-mobile-safety-v123.js
          node scripts/validate-wallet-first-exit-quote.js
          node scripts/validate-wallet-first-exit-flow.js
          node scripts/validate-wallet-first-user-actions.js
          node scripts/validate-wallet-cross-device-recovery.js
          node scripts/validate-biometric-app-lock.js
          node scripts/validate-release-assets.js

      - name: Validate TypeScript and Expo config
        run: |
          set -euo pipefail
          npm run typecheck
          npx expo-doctor
          npx expo config --type public >/tmp/nexa-v129-expo-config.txt

      - name: Preflight production backend
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 10 --max-time 20 \
            'https://nexa-backend-p2u0.onrender.com/api/v1/health' -o nexa-health.json
          node -e "const h=require('./nexa-health.json'); if(String(h.status||'').toLowerCase()!=='ok') process.exit(1); console.log('Backend production OK')"

      - name: Add build swap
        run: |
          set -euo pipefail
          if ! swapon --show | grep -q .; then
            sudo fallocate -l 4G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          free -h

      - name: Build signed v129 launch candidate APK with EAS local
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: 'true'
          NODE_ENV: 'production'
          EXPO_NO_TELEMETRY: '1'
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
          EAS_LOCAL_BUILD_SKIP_CLEANUP: '1'
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/nexa-wallet-first-v129-launch
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/local-build-artifacts-v129-launch
          GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8" -Dorg.gradle.workers.max=2'
          KOTLIN_DAEMON_JVM_OPTIONS: '-Xmx1536m,-XX:MaxMetaspaceSize=1024m'
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || (echo 'EXPO_TOKEN ausente' && exit 1)
          eas whoami
          FILE="Nexa-Launch-Candidate-${EXPECTED_VERSION}-v${EXPECTED_BUILD}.apk"
          rm -f "$FILE"
          eas build --platform android --profile open-finance-pilot --local --non-interactive --output "$GITHUB_WORKSPACE/$FILE"
          test -s "$FILE"
          SHA256=$(sha256sum "$FILE" | awk '{print $1}')
          echo "apk_file=$FILE" >> "$GITHUB_ENV"
          echo "apk_sha256=$SHA256" >> "$GITHUB_ENV"
          printf '%s  %s\n' "$SHA256" "$FILE" > SHA256SUMS.txt
          ls -lh "$FILE"

      - name: Preserve generated v129 APK immediately
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-Launch-Candidate-v129-RAW
          path: |
            ${{ env.apk_file }}
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Verify signed APK with aapt2 and apksigner
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)
          test -x "$APKSIGNER"
          test -x "$AAPT2"
          "$APKSIGNER" verify --verbose --print-certs "$apk_file" > apk-signature.txt
          "$AAPT2" dump badging "$apk_file" > apk-badging.txt
          "$AAPT2" dump permissions "$apk_file" > apk-permissions.txt

          PACKAGE=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" apk-badging.txt | head -1)
          VERSION_NAME=$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" apk-badging.txt | head -1)
          VERSION_CODE=$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" apk-badging.txt | head -1)
          TARGET_SDK=$(sed -n "s/^targetSdkVersion:'\([^']*\)'.*/\1/p" apk-badging.txt | head -1)

          printf '%s\n' "$PACKAGE" > apk-package.txt
          printf '%s\n' "$VERSION_NAME" > apk-version-name.txt
          printf '%s\n' "$VERSION_CODE" > apk-version-code.txt
          printf '%s\n' "$TARGET_SDK" > apk-target-sdk.txt

          test "$PACKAGE" = 'br.com.trynexa.app'
          test "$VERSION_NAME" = "$EXPECTED_VERSION"
          test "$VERSION_CODE" = "$EXPECTED_BUILD"
          test "$TARGET_SDK" = '36'
          echo "APK VERIFIED: Nexa $EXPECTED_VERSION v$EXPECTED_BUILD launch candidate, signed, target API 36."

      - name: Upload verified v129 launch candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-Launch-Candidate-v129-VERIFIED
          path: |
            ${{ env.apk_file }}
            SHA256SUMS.txt
            apk-signature.txt
            apk-badging.txt
            apk-package.txt
            apk-version-name.txt
            apk-version-code.txt
            apk-target-sdk.txt
            apk-permissions.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-Launch-Candidate-v129-build-diagnostics
          path: |
            ${{ runner.temp }}/nexa-wallet-first-v129-launch/logs
            local-build-artifacts-v129-launch
          if-no-files-found: warn
          retention-days: 14
