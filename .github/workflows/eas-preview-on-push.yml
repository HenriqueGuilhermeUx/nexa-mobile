name: EAS Preview APK

on:
  push:
    branches:
      - mobile-v2.1-product-alignment
    paths:
      - '.github/build-triggers/eas-preview.txt'
      - '.github/workflows/eas-preview-on-push.yml'

permissions:
  contents: read

concurrency:
  group: eas-preview-apk-mobile-v21
  cancel-in-progress: false

jobs:
  build:
    name: Submit safe Android preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate preview boundary
        run: |
          node scripts/validate-mobile-safety.js
          npm run typecheck
          npx expo-doctor

      - name: Resolve preview target
        shell: bash
        run: |
          set -euo pipefail
          TRIGGER="$(cat .github/build-triggers/eas-preview.txt 2>/dev/null || true)"
          if printf '%s' "$TRIGGER" | grep -qi 'production-safe'; then
            echo 'EAS_PROFILE=production-safe-preview' >> "$GITHUB_ENV"
            echo 'PREVIEW_API=https://nexa-backend-p2u0.onrender.com/api/v1' >> "$GITHUB_ENV"
            echo 'PREVIEW_LABEL=production-safe' >> "$GITHUB_ENV"
            node scripts/prepare-production-safe-preview.js
          else
            echo 'EAS_PROFILE=preview' >> "$GITHUB_ENV"
            echo 'PREVIEW_API=https://nexa-backend-wallet-v15-staging.onrender.com/api/v1' >> "$GITHUB_ENV"
            echo 'PREVIEW_LABEL=staging' >> "$GITHUB_ENV"
          fi

      - name: Validate resolved preview metadata
        shell: bash
        run: |
          set -euo pipefail
          node -e "
          const app=require('./app.json').expo;
          const build=Number(app.android?.versionCode||0);
          const api=String(app.extra?.apiUrl||'');
          const execution=app.extra?.financialExecutionEnabled;
          const label=process.env.PREVIEW_LABEL;
          if(execution!==false) throw new Error('Preview financial execution must remain false');
          if(label==='production-safe'){
            if(build!==105) throw new Error('Production-safe preview must be versionCode 105');
            if(api!=='https://nexa-backend-p2u0.onrender.com/api/v1') throw new Error('Production-safe preview must target production API');
          } else {
            if(build!==104) throw new Error('Staging preview must remain versionCode 104');
            if(api!=='https://nexa-backend-wallet-v15-staging.onrender.com/api/v1') throw new Error('Staging preview must target staging API');
          }
          console.log('Resolved preview metadata validated:', label, build, api);
          "

      - name: Smoke target backend
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 10 --max-time 20 "$PREVIEW_API/health" -o preview-health.json
          curl --fail --silent --show-error --max-time 20 "$PREVIEW_API/rewards/plans" -o preview-rewards.json
          curl --fail --silent --show-error --max-time 20 "$PREVIEW_API/swap/tokens" -o preview-tokens.json
          node <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('preview-health.json','utf8'));
          const r=JSON.parse(fs.readFileSync('preview-rewards.json','utf8'));
          const t=JSON.parse(fs.readFileSync('preview-tokens.json','utf8'));
          if(String(h.status||'').toLowerCase()!=='ok') throw new Error('Health not OK');
          if(Number(r?.economics?.userRewardShare)!==0.8 || Number(r?.economics?.nexaRewardShare)!==0.2) throw new Error('Rewards mismatch');
          if(JSON.stringify(t?.launchAssets||[])!==JSON.stringify(['USDC','BTC','ETH','XAUT'])) throw new Error('Assets mismatch');
          if(t?.internalTransferAsset!=='USDC') throw new Error('Internal transfer must remain USDC-only');
          console.log('Target backend contracts validated.');
          NODE

      - name: Submit Android preview APK
        env:
          CI: 'true'
        run: |
          eas build --platform android --profile "$EAS_PROFILE" --non-interactive --no-wait --json | tee eas-preview-build.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('eas-preview-build.json','utf8'));const b=Array.isArray(x)?x[0]:x;if(!b?.id)process.exit(1);console.log('Build ID:',b.id);fs.writeFileSync('eas-preview-build-id.txt',b.id+'\n')"

      - name: Upload build submission snapshot
        uses: actions/upload-artifact@v4
        with:
          name: eas-preview-build-submission
          path: |
            eas-preview-build.json
            eas-preview-build-id.txt
          retention-days: 14

      - name: Safety boundary
        run: |
          echo "Preview target: $PREVIEW_LABEL"
          echo "API: $PREVIEW_API"
          echo "Financial execution: false."
          echo "No Play Store submission is performed."
