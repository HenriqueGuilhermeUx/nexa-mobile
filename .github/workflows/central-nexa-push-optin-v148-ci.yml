name: Central Nexa Push Opt-in v148 CI
on:
  push:
    branches:
      - feat/central-nexa-push-optin-v148-20261112
  pull_request:
    paths:
      - 'src/lib/nexaCentralPush.ts'
      - 'app/central-nexa.tsx'
      - 'scripts/validate-central-nexa-push-optin-v148.js'
      - '.github/workflows/central-nexa-push-optin-v148-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_NEXA_API_URL: https://nexa-backend-p2u0.onrender.com/api/v1
      EXPO_PUBLIC_NEXA_RELEASE_CHANNEL: production
      EXPO_PUBLIC_NEXA_ASSISTANT_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node scripts/validate-central-nexa-v148.js && node scripts/validate-central-nexa-push-optin-v148.js
      - run: |
          git fetch origin feat/central-nexa-v148-ota-20261112 --depth=1
          git diff --exit-code origin/feat/central-nexa-v148-ota-20261112 HEAD -- app.json app.config.js eas.json package.json package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run export:android
