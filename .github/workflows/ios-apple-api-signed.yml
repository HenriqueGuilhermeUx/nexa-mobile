name: Nexa iOS signed IPA (Apple API)

on:
  workflow_dispatch:
  push:
    branches:
      - fix/ios-wallet-only-review-20261018
    paths:
      - .github/workflows/ios-apple-api-signed.yml
      - scripts/validate-mobile-safety.js

permissions:
  contents: read
  actions: read

concurrency:
  group: nexa-ios-apple-signed
  cancel-in-progress: false

jobs:
  ios:
    name: Sign and build iOS 2.0.43 (150)
    runs-on: macos-26
    timeout-minutes: 180
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
      IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      IOS_SIGNING_BACKUP_PASSPHRASE: ${{ secrets.IOS_SIGNING_BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify compatible Xcode
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner Xcode inventory:"
          ls -d /Applications/Xcode*.app || true
          echo "Expo SDK 57 requires Xcode 26.4 or newer."
          if [ -d /Applications/Xcode_26.4.app ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_26.4.app/Contents/Developer" >> "$GITHUB_ENV"
          elif [ -d /Applications/Xcode_26.4.0.app ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_26.4.0.app/Contents/Developer" >> "$GITHUB_ENV"
          else
            echo "::error::Runner does not provide Xcode 26.4+. Use a compatible hosted image or EAS remote build."
            exit 1
          fi
      - name: Validate signing prerequisites
        shell: bash
        run: |
          set -euo pipefail
          for key in EXPO_TOKEN APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!key:-}" ]; then echo "::error::Missing required GitHub secret: $key"; exit 1; fi
          done
          node - <<'NODE'
          const c=require('./app.config.js')({config:require('./app.json').expo});
          if(c.ios?.bundleIdentifier!=='br.com.trynexa.app' || c.ios?.buildNumber!=='150' || c.version!=='2.0.43') throw Error('Unexpected iOS release identity');
          NODE
      - name: Install and validate application
        run: |
          npm install --no-audit --no-fund
          node scripts/validate-mobile-safety.js
          npm run typecheck
          npx expo-doctor
      - name: Install signing tools
        run: |
          gem install fastlane --no-document
          npm install --global eas-cli
      - name: Download previously validated encrypted signing backup
        uses: actions/download-artifact@v4
        with:
          name: Nexa-iOS-validated-signing-encrypted
          run-id: 39071505139
          github-token: ${{ github.token }}
          path: validated-signing
      - name: Restore existing Apple distribution identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "${IOS_SIGNING_BACKUP_PASSPHRASE:-}"
          test -s validated-signing/nexa-validated-signing.enc
          mkdir -p "$RUNNER_TEMP/nexa-ios-signing"
          chmod 700 "$RUNNER_TEMP/nexa-ios-signing"
          openssl enc -d -aes-256-cbc -pbkdf2 -in validated-signing/nexa-validated-signing.enc -out "$RUNNER_TEMP/nexa-ios-signing/validated.tar.gz" -pass env:IOS_SIGNING_BACKUP_PASSPHRASE
          tar -xzf "$RUNNER_TEMP/nexa-ios-signing/validated.tar.gz" -C "$RUNNER_TEMP/nexa-ios-signing" distribution.p12 distribution-password.txt
          rm -f "$RUNNER_TEMP/nexa-ios-signing/validated.tar.gz"
          test -s "$RUNNER_TEMP/nexa-ios-signing/distribution.p12"
          signing_password="$(cat "$RUNNER_TEMP/nexa-ios-signing/distribution-password.txt")"
          openssl pkcs12 -in "$RUNNER_TEMP/nexa-ios-signing/distribution.p12" -passin "pass:$signing_password" -info -noout >/dev/null 2>&1
          echo 'Existing encrypted distribution identity restored; no new certificate issued.'
      - name: Generate isolated App Store signing credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nexa-ios-signing"
          chmod 700 "$RUNNER_TEMP/nexa-ios-signing"
          export IOS_DISTRIBUTION_P12_BASE64="$(base64 < "$RUNNER_TEMP/nexa-ios-signing/distribution.p12" | tr -d '\n')"
          export IOS_DISTRIBUTION_P12_PASSWORD="$(cat "$RUNNER_TEMP/nexa-ios-signing/distribution-password.txt")"
          ruby scripts/ios-ci-signing.rb "$RUNNER_TEMP/nexa-ios-signing"
          test -s "$RUNNER_TEMP/nexa-ios-signing/distribution.p12"
          test -s "$RUNNER_TEMP/nexa-ios-signing/profile.mobileprovision"
      - name: Build signed IPA locally on macOS
        shell: bash
        env:
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/nexa-ios-build
          EAS_LOCAL_BUILD_SKIP_CLEANUP: '0'
        run: |
          set -euo pipefail
          export EAS_LOCAL_BUILD_ARTIFACTS_DIR="$GITHUB_WORKSPACE/ios-artifacts"
          mkdir -p "$EAS_LOCAL_BUILD_ARTIFACTS_DIR"
          node scripts/write-ios-ci-credentials.js "$RUNNER_TEMP/nexa-ios-signing" > /dev/null
          eas build --platform ios --profile ios-review-safe --local --non-interactive --output "$EAS_LOCAL_BUILD_ARTIFACTS_DIR/Nexa-2.0.43-150.ipa"
          test -s "$EAS_LOCAL_BUILD_ARTIFACTS_DIR/Nexa-2.0.43-150.ipa"
          shasum -a 256 "$EAS_LOCAL_BUILD_ARTIFACTS_DIR/Nexa-2.0.43-150.ipa" > "$EAS_LOCAL_BUILD_ARTIFACTS_DIR/SHA256SUMS.txt"
      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-iOS-2.0.43-150
          path: ios-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/nexa-ios-signing"
          rm -f credentials.json
