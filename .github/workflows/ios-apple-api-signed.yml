name: Nexa iOS signed IPA (Apple API)
# Signing retry after updating Apple API credentials in repository secrets.

on:
  workflow_dispatch:
    inputs:
      issue_new_certificate:
        description: 'Type ISSUE_ONCE only for a fresh Apple certificate (never on retries)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nexa-ios-apple-signed
  cancel-in-progress: false

jobs:
  ios:
    name: Sign and build iOS 2.0.43 (149)
    runs-on: macos-26
    timeout-minutes: 180
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
      IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      IOS_SIGNING_BACKUP_PASSPHRASE: ${{ secrets.IOS_SIGNING_BACKUP_PASSPHRASE }}
      IOS_ALLOW_NEW_CERTIFICATE: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-review-readiness-20261016
      - name: Verify native toolchain
        run: |
          xcodebuild -version
          xcrun --find xcodebuild
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate signing prerequisites
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in EXPO_TOKEN APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Unavailable in this workflow: $key"
              missing=1
            else
              echo "Available: $key"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Check the Actions secrets for this exact repository and whether they are environment-scoped."
            exit 1
          fi
          if [ -z "${IOS_SIGNING_BACKUP_PASSPHRASE:-}" ]; then
            echo '::error::Missing IOS_SIGNING_BACKUP_PASSPHRASE; refusing to create an unbacked Apple signing identity.'
            exit 1
          fi
          node - <<'NODE'
          const c=require('./app.config.js')({config:require('./app.json').expo});
          if(c.ios?.bundleIdentifier!=='br.com.trynexa.app' || c.ios?.buildNumber!=='149' || c.version!=='2.0.43') throw Error('Unexpected iOS release identity');
          NODE
      - name: Install and validate application
        run: |
          npm install --no-audit --no-fund
          node scripts/validate-mobile-safety.js
          npm run typecheck
          npx expo-doctor
      - name: Install signing tools
        run: |
          gem install fastlane --no-document
          npm install --global eas-cli
      - name: Generate isolated App Store signing credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nexa-ios-signing"
          chmod 700 "$RUNNER_TEMP/nexa-ios-signing"
          ruby scripts/ios-ci-signing.rb "$RUNNER_TEMP/nexa-ios-signing"
          test -s "$RUNNER_TEMP/nexa-ios-signing/distribution.p12"
          test -s "$RUNNER_TEMP/nexa-ios-signing/profile.mobileprovision"
      - name: Encrypt signing identity backup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/nexa-ios-signing"
          mkdir -p ios-signing-backup
          if [ ! -s "$dir/distribution.p12" ]; then
            candidate="$(find "$dir" -maxdepth 1 -name '*.p12' -type f | head -n 1 || true)"
            if [ -n "$candidate" ]; then cp "$candidate" "$dir/distribution.p12"; fi
          fi
          if [ -s "$dir/distribution.p12" ]; then
            files=(distribution.p12)
            for optional in distribution-password.txt profile.mobileprovision; do
              if [ -f "$dir/$optional" ]; then files+=("$optional"); fi
            done
            tar -C "$dir" -czf "$RUNNER_TEMP/ios-signing.tar.gz" "${files[@]}"
            openssl enc -aes-256-cbc -pbkdf2 -salt -in "$RUNNER_TEMP/ios-signing.tar.gz" -out ios-signing-backup/nexa-ios-signing.enc -pass env:IOS_SIGNING_BACKUP_PASSPHRASE
            rm -f "$RUNNER_TEMP/ios-signing.tar.gz"
          else
            echo 'No PKCS12 file was produced; nothing to back up.'
          fi
      - name: Preserve encrypted signing backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-iOS-signing-encrypted
          path: ios-signing-backup/nexa-ios-signing.enc
          if-no-files-found: warn
          retention-days: 90
      - name: Build signed IPA locally on macOS
        shell: bash
        env:
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/nexa-ios-build
          EAS_LOCAL_BUILD_SKIP_CLEANUP: '0'
        run: |
          set -euo pipefail
          export EAS_LOCAL_BUILD_ARTIFACTS_DIR="$GITHUB_WORKSPACE/ios-artifacts"
          mkdir -p "$EAS_LOCAL_BUILD_ARTIFACTS_DIR"
          node scripts/write-ios-ci-credentials.js "$RUNNER_TEMP/nexa-ios-signing" > /dev/null
          eas build --platform ios --profile ios-review-safe --local --non-interactive --output "$EAS_LOCAL_BUILD_ARTIFACTS_DIR/Nexa-2.0.43-149.ipa"
          test -s "$EAS_LOCAL_BUILD_ARTIFACTS_DIR/Nexa-2.0.43-149.ipa"
          shasum -a 256 "$EAS_LOCAL_BUILD_ARTIFACTS_DIR/Nexa-2.0.43-149.ipa" > "$EAS_LOCAL_BUILD_ARTIFACTS_DIR/SHA256SUMS.txt"
      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-iOS-2.0.43-149
          path: ios-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/nexa-ios-signing"
          rm -f credentials.json
