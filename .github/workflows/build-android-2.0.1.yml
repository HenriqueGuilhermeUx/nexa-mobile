name: Build Nexa Android 2.0.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-android-2.0.1.yml
      - .github/build-triggers/android-2.0.1.txt
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build-android-2.0.1.yml
      - .github/build-triggers/android-2.0.1.txt

permissions:
  contents: read

concurrency:
  group: nexa-android-production-2.0.1-v31-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build signed Android AAB v31
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Expo authentication secret
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Repository secret EXPO_TOKEN is required."
            exit 1
          fi

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate source, assets and security contracts
        run: |
          node scripts/validate-mobile-safety.js
          node scripts/validate-release-assets.js
          npm run typecheck
          npx expo-doctor

      - name: Verify release configuration before build
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8')).expo;
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          const expected = {
            version: '2.0.1',
            versionCode: 31,
            package: 'br.com.trynexa.app',
          };
          const failures = [];
          if (app.version !== expected.version) failures.push(`version=${app.version}`);
          if (Number(app.android?.versionCode) !== expected.versionCode) failures.push(`versionCode=${app.android?.versionCode}`);
          if (app.android?.package !== expected.package) failures.push(`package=${app.android?.package}`);
          if (app.extra?.financialExecutionEnabled !== false) failures.push('financialExecutionEnabled must be false');
          if (eas.cli?.appVersionSource !== 'local') failures.push(`appVersionSource=${eas.cli?.appVersionSource}`);
          if (eas.build?.production?.autoIncrement !== false) failures.push(`autoIncrement=${eas.build?.production?.autoIncrement}`);
          if (eas.build?.production?.android?.buildType !== 'app-bundle') failures.push(`buildType=${eas.build?.production?.android?.buildType}`);
          if (failures.length) {
            console.error('Release configuration mismatch:', failures.join(', '));
            process.exit(1);
          }
          console.log(JSON.stringify({ ok: true, ...expected }, null, 2));
          NODE

      - name: Export Android JavaScript bundle
        env:
          CI: 'true'
          EXPO_NO_TELEMETRY: '1'
        run: npm run export:android

      - name: Build signed production AAB locally
        id: local_build
        continue-on-error: true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_TELEMETRY: '1'
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
          EAS_LOCAL_BUILD_SKIP_CLEANUP: '1'
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/nexa-eas-local-v31
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/local-build-artifacts-v31
        run: |
          eas build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output "$GITHUB_WORKSPACE/Nexa-2.0.1-android-v31-verified.aab"

      - name: Upload local build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-2.0.1-v31-local-build-diagnostics
          path: |
            ${{ runner.temp }}/nexa-eas-local-v31/logs
            local-build-artifacts-v31
          if-no-files-found: warn
          retention-days: 14

      - name: Fail when local build fails
        if: steps.local_build.outcome == 'failure'
        run: exit 1

      - name: Verify package and version inside AAB
        run: |
          set -euo pipefail
          test -s Nexa-2.0.1-android-v31-verified.aab
          BUNDLETOOL_VERSION=1.18.1
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            --output "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest \
            --bundle=Nexa-2.0.1-android-v31-verified.aab \
            --module=base \
            > aab-manifest.xml
          grep -Eq 'package="br\.com\.trynexa\.app"' aab-manifest.xml
          grep -Eq 'android:versionCode="31"' aab-manifest.xml
          grep -Eq 'android:versionName="2\.0\.1"' aab-manifest.xml
          {
            echo 'verified=true'
            echo 'package=br.com.trynexa.app'
            echo 'versionName=2.0.1'
            echo 'versionCode=31'
            echo 'financialExecutionEnabled=false'
            echo "sourceCommit=$GITHUB_SHA"
          } > aab-version-verification.txt
          cat aab-version-verification.txt

      - name: Create release metadata
        run: |
          sha256sum Nexa-2.0.1-android-v31-verified.aab > SHA256SUMS.txt
          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('build-metadata.json', JSON.stringify({
            product: 'Nexa',
            version: '2.0.1',
            androidVersionCode: 31,
            package: 'br.com.trynexa.app',
            releaseChannel: 'primeiros-nexa',
            profile: 'production',
            buildMode: 'eas-local-on-github-actions',
            binaryManifestVerified: true,
            actualSaleRedemptionHistory: true,
            gitCommit: process.env.GITHUB_SHA,
            financialExecutionEnabled: false,
            createdAt: new Date().toISOString(),
          }, null, 2) + '\n');
          NODE

      - name: Upload verified Google Play artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-2.0.1-Android-v31-VERIFIED-Google-Play
          path: |
            Nexa-2.0.1-android-v31-verified.aab
            SHA256SUMS.txt
            build-metadata.json
            aab-version-verification.txt
            aab-manifest.xml
          if-no-files-found: error
          retention-days: 30
