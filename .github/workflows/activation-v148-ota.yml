name: Nexa activation copy OTA - Android 2.0.43
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexa-activation-ota-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_NEXA_API_URL: https://nexa-backend-p2u0.onrender.com/api/v1
      EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_API_URL: https://nexa-backend-p2u0.onrender.com/api/v1
      EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED: 'true'
      EXPO_PUBLIC_NEXA_ASSISTANT_ENABLED: 'true'
      EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_ENABLED: 'true'
      EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_RECURRING_ENABLED: 'true'
      EXPO_PUBLIC_NEXA_RELEASE_CHANNEL: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: node scripts/validate-mobile-safety-v123.js
      - name: Prepare OTA runtime identity only (no native binary)
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json','utf8'));
          const eas = JSON.parse(fs.readFileSync('eas.json','utf8'));
          if (app.expo.runtimeVersion?.policy !== 'appVersion' || eas.build.production.channel !== 'production') throw Error('OTA policy mismatch');
          if (app.expo.android.package !== 'br.com.trynexa.app') throw Error('Unexpected Android package');
          if (app.expo.version !== '2.0.42' || app.expo.android.versionCode !== 145) throw Error('Unexpected source version: review before publishing');
          if (!fs.readFileSync('app/index.tsx','utf8').includes('sem precisar depositar agora')) throw Error('Activation copy missing');
          app.expo.version = '2.0.43';
          app.expo.android.versionCode = 148;
          fs.writeFileSync('app.json',JSON.stringify(app,null,2)+'\n');
          const configPath='app.config.js';
          const config=fs.readFileSync(configPath,'utf8')
            .replace("version: '2.0.42'","version: '2.0.43'")
            .replace('versionCode: 145','versionCode: 148');
          fs.writeFileSync(configPath,config);
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.version='2.0.43';
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          const dynamic=require('./app.config.js')({config:app.expo});
          if (dynamic.version !== '2.0.43' || dynamic.android.versionCode !== 148) throw Error('Runtime override failed');
          NODE
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 24.8.0
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas whoami
      - name: Publish JS-only Android activation OTA
        run: eas update --channel production --platform android --message "Nexa 2.0.43 onboarding and Didit activation guidance" --non-interactive
