name: Nexa activation copy OTA - Android 2.0.43
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activation-v148-ota.yml'
permissions:
  contents: read
concurrency:
  group: nexa-activation-ota-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_NEXA_API_URL: https://nexa-backend-p2u0.onrender.com/api/v1
      EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_API_URL: https://nexa-backend-p2u0.onrender.com/api/v1
      EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED: 'true'
      EXPO_PUBLIC_NEXA_ASSISTANT_ENABLED: 'true'
      EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_ENABLED: 'true'
      EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_RECURRING_ENABLED: 'true'
      EXPO_PUBLIC_NEXA_RELEASE_CHANNEL: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/aave-v148-internal-apk-20261102
          fetch-depth: 0
      - name: Apply approved text screens only
        run: |
          git fetch origin main --depth=1
          git show origin/main:app/index.tsx > app/index.tsx
          git show origin/main:app/kyc.tsx > app/kyc.tsx
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: node scripts/validate-mobile-safety-v123.js
      - name: Verify production v148 OTA target
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json','utf8')).expo;
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          const eas = JSON.parse(fs.readFileSync('eas.json','utf8'));
          const dynamic = require('./app.config.js')({config:app});
          if (app.version !== '2.0.43' || app.android.versionCode !== 148 || pkg.version !== '2.0.43') throw Error('Unexpected v148 baseline');
          if (dynamic.version !== '2.0.43' || dynamic.android.versionCode !== 148) throw Error('Dynamic config mismatch');
          if (app.runtimeVersion?.policy !== 'appVersion' || eas.build.production.channel !== 'production') throw Error('Wrong OTA runtime or channel');
          if (app.android.package !== 'br.com.trynexa.app') throw Error('Wrong Android package');
          if (!fs.readFileSync('app/index.tsx','utf8').includes('sem precisar depositar agora')) throw Error('Activation copy missing');
          NODE
      - name: Confirm only two text screens changed
        run: |
          git diff --name-only | sort > /tmp/changed-files
          printf 'app/index.tsx\napp/kyc.tsx\n' | sort > /tmp/allowed-files
          diff -u /tmp/allowed-files /tmp/changed-files
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 24.8.0
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas whoami
      - name: Publish JS-only Android activation OTA
        run: eas update --channel production --platform android --message "Nexa 2.0.43 onboarding and Didit activation guidance" --non-interactive
