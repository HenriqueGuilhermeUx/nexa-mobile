name: Nexa Pay Pilot APK Runner

on:
  pull_request:
    branches:
      - ci/nexa-pay-pilot-apk-base
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-apk:
    if: github.head_ref == 'prep/nexa-pay-us-receiving-disabled'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_NO_INTERACTIVE: "1"
      EXPO_PUBLIC_NEXA_API_URL: "https://nexa-backend-p2u0.onrender.com/api/v1"
      EXPO_PUBLIC_NEXA_PAY_API_URL: "https://nexa-open-finance-homolog.onrender.com/api/v1"
      EXPO_PUBLIC_NEXA_PAY_ENABLED: "true"
      EXPO_PUBLIC_NEXA_PAY_QR_ENABLED: "false"
      EXPO_PUBLIC_NEXA_PAY_WALLET_EXECUTION_ENABLED: "false"
      EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED: "false"
      EXPO_PUBLIC_NEXA_ASSISTANT_ENABLED: "true"
      EXPO_PUBLIC_NEXA_RELEASE_CHANNEL: "nexa-pay-pilot"

    steps:
      - name: Checkout pilot branch
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Make pilot install alongside production
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          data.expo.name = 'Nexa Pay Pilot';
          data.expo.scheme = 'nexa-pay-pilot';
          data.expo.android = data.expo.android || {};
          data.expo.android.package = 'br.com.trynexa.pilot';
          data.expo.android.versionCode = 146;
          data.expo.extra = data.expo.extra || {};
          data.expo.extra.releaseChannel = 'nexa-pay-pilot';
          data.expo.extra.financialExecutionEnabled = false;
          fs.writeFileSync('app.json', JSON.stringify(data, null, 2) + '\n');
          NODE

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare artifact
        shell: bash
        run: |
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          cp "$APK" Nexa-Pay-Pilot.apk
          ls -lh Nexa-Pay-Pilot.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexa-pay-pilot-apk
          path: Nexa-Pay-Pilot.apk
          if-no-files-found: error
          retention-days: 7
