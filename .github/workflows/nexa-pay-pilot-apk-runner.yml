name: Nexa Pay Pilot APK Runner

on:
  pull_request:
    branches:
      - ci/nexa-pay-pilot-apk-base
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-apk:
    if: github.head_ref == 'prep/nexa-pay-us-receiving-disabled'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_NO_INTERACTIVE: "1"
      EXPO_PUBLIC_NEXA_API_URL: "https://nexa-backend-p2u0.onrender.com/api/v1"
      EXPO_PUBLIC_NEXA_PAY_API_URL: "https://nexa-open-finance-homolog.onrender.com/api/v1"
      EXPO_PUBLIC_NEXA_PAY_ENABLED: "true"
      EXPO_PUBLIC_NEXA_PAY_QR_ENABLED: "true"
      EXPO_PUBLIC_NEXA_PAY_WALLET_EXECUTION_ENABLED: "true"
      EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED: "false"
      EXPO_PUBLIC_NEXA_ASSISTANT_ENABLED: "true"
      EXPO_PUBLIC_NEXA_RELEASE_CHANNEL: "nexa-pay-pilot"
      NODE_OPTIONS: "--max-old-space-size=6144"

    steps:
      - name: Checkout pilot branch
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Make pilot install alongside production
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          data.expo.name = 'Nexa Pay Pilot';
          data.expo.scheme = 'nexa-pay-pilot';
          data.expo.icon = './assets/brand/nexa-pilot-icon-exact.png';
          data.expo.android = data.expo.android || {};
          data.expo.android.package = 'br.com.trynexa.paypilot';
          data.expo.android.versionCode = 146;
          delete data.expo.android.adaptiveIcon;
          data.expo.plugins = (data.expo.plugins || []).map((plugin) => {
            if (Array.isArray(plugin) && plugin[0] === 'expo-splash-screen') {
              return [
                'expo-splash-screen',
                {
                  ...(plugin[1] || {}),
                  image: './assets/brand/nexa-pilot-icon-exact.png',
                  backgroundColor: '#06111F'
                }
              ];
            }
            return plugin;
          });
          data.expo.extra = data.expo.extra || {};
          data.expo.extra.releaseChannel = 'nexa-pay-pilot';
          data.expo.extra.pilotBuild = true;
          data.expo.extra.financialExecutionEnabled = false;
          fs.writeFileSync('app.json', JSON.stringify(data, null, 2) + '\n');
          NODE

      - name: Verify approved Nexa pilot icon
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/brand/nexa-pilot-icon-exact.png
          file assets/brand/nexa-pilot-icon-exact.png

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Tune Gradle memory for CI
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          {
            echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
            echo "org.gradle.workers.max=2"
            echo "org.gradle.parallel=false"
          } >> "$HOME/.gradle/gradle.properties"

      - name: Build standalone release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Sign installable pilot APK
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="$(find android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$UNSIGNED"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          KEYSTORE="$RUNNER_TEMP/nexa-pay-pilot.jks"
          keytool -genkeypair             -keystore "$KEYSTORE"             -storepass nexapaypilot             -keypass nexapaypilot             -alias nexapaypilot             -keyalg RSA             -keysize 2048             -validity 3650             -dname "CN=Nexa Pay Pilot, OU=Pilot, O=Nexa, L=Santos, ST=SP, C=BR"             -noprompt

          ALIGNED="$RUNNER_TEMP/Nexa-Pay-Pilot-aligned.apk"
          "$ZIPALIGN" -p -f 4 "$UNSIGNED" "$ALIGNED"

          "$APKSIGNER" sign             --ks "$KEYSTORE"             --ks-key-alias nexapaypilot             --ks-pass pass:nexapaypilot             --key-pass pass:nexapaypilot             --out Nexa-Pay-Pilot.apk             "$ALIGNED"

          "$APKSIGNER" verify --verbose --print-certs Nexa-Pay-Pilot.apk
          ls -lh Nexa-Pay-Pilot.apk

      - name: Prepare checksum
        shell: bash
        run: |
          sha256sum Nexa-Pay-Pilot.apk > Nexa-Pay-Pilot.sha256.txt
          cat Nexa-Pay-Pilot.sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexa-pay-pilot-apk
          path: |
            Nexa-Pay-Pilot.apk
            Nexa-Pay-Pilot.sha256.txt
          if-no-files-found: error
          retention-days: 7
