name: Maya Actions v148 — integrated Android QA
on:
  push:
    branches: [integration/maya-actions-v148]
  pull_request:
    branches: [integration/maya-actions-v148]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maya-actions-integrated-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      EXPO_PUBLIC_NEXA_MAYA_PREMIUM_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Fetch proven Android v148 OTA baseline
        run: git fetch origin feat/aave-v148-internal-apk-20261102:refs/remotes/origin/feat/aave-v148-internal-apk-20261102
      - name: Validate OTA v148 scope
        run: node scripts/validate-maya-release-train.js
      - name: Validate Actions V1
        run: node scripts/validate-maya-actions-v1.js
      - name: Validate agenda local notifications
        run: |
          if [ -e scripts/validate-maya-actions-agenda-v1.js ]; then
            node scripts/validate-maya-actions-agenda-v1.js
          fi
      - name: Validate web price-quote contracts
        run: |
          if [ -e scripts/validate-maya-web-quotes-v1.js ]; then
            node scripts/validate-maya-web-quotes-v1.js
          fi
      - name: Validate planning goals
        run: |
          if [ -e scripts/validate-maya-planning-v1.js ]; then
            node scripts/validate-maya-planning-v1.js
          fi
      - name: Validate app safety
        run: node scripts/validate-mobile-safety-v123.js
      - run: npm run typecheck
      - run: npx expo-doctor
      - run: npm run export:android
