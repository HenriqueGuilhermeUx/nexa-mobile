name: Nexa Connect v148 — EAS internal build status (read-only)

on:
  push:
    branches:
      - feat/walletconnect-viewonly-v148-forwardport-20261028
    paths:
      - .github/workflows/walletconnect-v148-eas-build-status.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure this is isolated QA and not a release submission
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const a = require('./app.json').expo;
          const qa = require('./eas.json').build['wallet-inbound-lab-v148'];
          assert.equal(a.android.versionCode, 148);
          assert.equal(a.android.package, 'br.com.trynexa.app');
          assert.equal(qa.distribution, 'internal');
          assert.equal(qa.env.EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED, 'false');
          assert.equal(qa.env.EXPO_PUBLIC_NEXA_REOWN_ENABLED, 'false');
          console.log('Checking existing isolated build only.');
          NODE
      - name: Authenticate read-only EAS query
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || (echo 'EXPO_TOKEN unavailable for status query.' && exit 1)
      - name: Install Expo config plugins from locked QA dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Query previously submitted APK — no new build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          eas build:view a84e0eed-5a14-4c3c-86ae-3d2bcd16be95 --json > /tmp/walletconnect-eas-build.json
          node <<'NODE'
          const fs = require('node:fs');
          const x = JSON.parse(fs.readFileSync('/tmp/walletconnect-eas-build.json', 'utf8'));
          const status = String(x.status || 'UNKNOWN').toUpperCase();
          const profile = x.buildProfile || x.metadata?.buildProfile || '';
          const platform = x.platform || '';
          const applicationId = x.applicationId || x.appIdentifier || x.metadata?.appIdentifier || '';
          const artifactPresent = Boolean(x.artifacts?.buildUrl || x.artifacts?.applicationArchiveUrl);
          const buildId = String(x.id || '');
          if(buildId !== 'a84e0eed-5a14-4c3c-86ae-3d2bcd16be95') throw Error('EAS_BUILD_ID_MISMATCH');
          const sanitized = {id:buildId, status, platform, profile, applicationId, apkAvailable:artifactPresent, finishedAt:x.completedAt || x.finishedAt || null, errorCode:x.error?.errorCode || null};
          console.log('EAS_BUILD_STATUS ' + JSON.stringify(sanitized));
          if(process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '## Nexa Wallet Connect QA — EAS Build\n\n' +
              '| Campo | Resultado |\n|---|---|\n' +
              '| Build | `' + buildId + '` |\n' +
              '| Estado | **' + status + '** |\n' +
              '| Arquivo instalável | ' + (artifactPresent ? 'presente' : 'ainda não confirmado') + ' |\n' +
              '| Perfil | `' + String(profile) + '` |\n' +
              '| Pacote | `' + String(applicationId) + '` |\n' +
              '\nNenhuma publicação Play Store, OTA ou movimentação financeira foi solicitada.\n');
          }
          if(status === 'ERRORED' || status === 'CANCELED') process.exitCode=1;
          if(status === 'FINISHED' && !artifactPresent) process.exitCode=1;
          NODE
      - name: No mutation boundary
        if: always()
        run: echo 'This workflow only queries an existing EAS build; does not submit, download, publish or update apps.'
