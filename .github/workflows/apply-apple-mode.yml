name: Apply Apple Mode to production App

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply_apple_mode.py'
      - 'nexa-mobile/nexa-mobile/AppleModeHome.js'
      - '.github/workflows/apply-apple-mode.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Apple Mode to official App.js
        run: python3 scripts/apply_apple_mode.py

      - name: Commit production App.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexa-mobile/nexa-mobile/App.js

          if git diff --cached --quiet; then
            echo "Apple Mode already applied. No commit needed."
            exit 0
          fi

          git commit -m "Transform production app into Nexa Apple Mode"
          git push
