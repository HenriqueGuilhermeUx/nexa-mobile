name: Maya Actions QA A evidence gate (offline)

on:
  push:
    branches:
      - qa/maya-actions-wave-a-evidence-20261111
  pull_request:
    branches:
      - integration/maya-actions-v148
    paths:
      - 'scripts/qa/maya-actions-wave-a-evidence-gate.js'
      - 'scripts/qa/maya-actions-wave-a-evidence-gate.test.js'
      - 'scripts/qa/maya-actions-wave-a-cli-failclosed.test.js'
      - 'scripts/qa/maya-actions-wave-a-cardinality.test.js'
      - '.github/workflows/maya-actions-wave-a-evidence-ci.yml'
      - 'docs/qa/maya-actions-wave-a-*.md'
      - 'docs/maya-actions-12-branches-execution.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check offline gate and test file syntax
        id: syntax
        run: |
          node --check scripts/qa/maya-actions-wave-a-evidence-gate.js
          node --check scripts/qa/maya-actions-wave-a-evidence-gate.test.js
          node --check scripts/qa/maya-actions-wave-a-cli-failclosed.test.js
          node --check scripts/qa/maya-actions-wave-a-cardinality.test.js
      - name: Run synthetic evidence regression checks
        id: synthetic
        run: node --test scripts/qa/maya-actions-wave-a-evidence-gate.test.js scripts/qa/maya-actions-wave-a-cli-failclosed.test.js scripts/qa/maya-actions-wave-a-cardinality.test.js
      - name: Verify fail-closed without physical evidence
        id: fail_closed
        shell: bash
        run: |
          set +e
          node scripts/qa/maya-actions-wave-a-evidence-gate.js > gate.log 2>&1
          status=$?
          set -e
          test "$status" -eq 2
          grep -q 'BLOCKED:' gate.log

      - name: Record offline QA evidence gate provenance
        if: always()
        shell: bash
        env:
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          TEST_OUTCOME: ${{ steps.synthetic.outcome }}
          FAIL_CLOSED_OUTCOME: ${{ steps.fail_closed.outcome }}
        run: |
          {
            echo '### Maya Actions QA A — offline CI provenance'
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Ref: \`$GITHUB_REF\`"
            echo "- Node: \`$(node --version)\`"
            echo "- Syntax validation: \`$SYNTAX_OUTCOME\`"
            echo "- Synthetic regression: \`$TEST_OUTCOME\`"
            echo "- Missing-evidence fail-closed: \`$FAIL_CLOSED_OUTCOME\`"
            echo '- Physical A01–A16 verification: **not performed by this workflow**'
            echo '- OTA production authorization: **not granted**'
          } >> "$GITHUB_STEP_SUMMARY"
