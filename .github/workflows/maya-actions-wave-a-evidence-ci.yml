name: Maya Actions QA A evidence gate (offline)

on:
  push:
    branches:
      - qa/maya-actions-wave-a-evidence-20261111
    paths:
      - 'scripts/qa/maya-actions-wave-a-evidence-gate.js'
      - 'scripts/qa/maya-actions-wave-a-evidence-gate.test.js'
      - '.github/workflows/maya-actions-wave-a-evidence-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run synthetic evidence regression checks
        run: node scripts/qa/maya-actions-wave-a-evidence-gate.test.js
      - name: Verify fail-closed without physical evidence
        shell: bash
        run: |
          set +e
          node scripts/qa/maya-actions-wave-a-evidence-gate.js > gate.log 2>&1
          status=$?
          set -e
          test "$status" -eq 2
          grep -q 'BLOCKED:' gate.log
