name: Maya cumulative main v148 - safe Android QA only
on:
  push:
    branches: [release/maya-cumulative-main-v148-qa-20261117]
    paths:
      - '.github/workflows/maya-main-cumulative-qa.yml'
      - 'app/assistant.tsx'
      - 'app/_layout.tsx'
      - 'app/maya-*.tsx'
      - 'src/maya-actions/**'
      - 'scripts/validate-maya-main-cumulative-qa.cjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maya-cumulative-main-v148-qa
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_NEXA_ASSISTANT_ENABLED: 'true'
      EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED: 'false'
      EXPO_PUBLIC_NEXA_MAYA_AGENTICS_ENABLED: 'false'
      EXPO_PUBLIC_NEXA_RELEASE_CHANNEL: maya-cumulative-main-v148-qa
      EXPO_PUBLIC_NEXA_API_URL: https://nexa-backend-p2u0.onrender.com/api/v1
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify additive changes over latest main, native identity and no missing links
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          node scripts/validate-maya-main-cumulative-qa.cjs
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: node scripts/validate-mobile-safety-v123.js
      - run: npm run export:android
  stage-qa-only:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_NEXA_API_URL: https://nexa-backend-p2u0.onrender.com/api/v1
      EXPO_PUBLIC_NEXA_ASSISTANT_ENABLED: 'true'
      EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED: 'false'
      EXPO_PUBLIC_NEXA_MAYA_AGENTICS_ENABLED: 'false'
      EXPO_PUBLIC_NEXA_RELEASE_CHANNEL: maya-cumulative-main-v148-qa
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 27.9.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Block if Expo production channel is not exclusively production
        run: |
          node <<'NODE'
          (async()=>{
            if(!process.env.EXPO_TOKEN)throw Error('Missing Expo credentials');
            const query='query($appId:String!){app{byId(appId:$appId){updateChannelByName(name:"production"){updateBranches(offset:0,limit:10){name}}}}}';
            const response=await fetch('https://api.expo.dev/graphql',{
              method:'POST',
              headers:{Authorization:'Bearer '+process.env.EXPO_TOKEN,'Content-Type':'application/json'},
              body:JSON.stringify({query,variables:{appId:'b3faabec-283a-4ba2-88b5-f096304e68aa'}}),
              signal:AbortSignal.timeout(15000),
            });
            const body=await response.json();
            const names=body.data?.app?.byId?.updateChannelByName?.updateBranches?.map(x=>x.name)||[];
            if(!response.ok||body.errors?.length||names.length!==1||names[0]!=='production')throw Error('Production mapping changed; stop QA');
            console.log('Production EAS mapping preserved. QA only.');
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
      - name: OTA to unlinked Android QA branch only
        run: eas update --branch maya-cumulative-main-v148-qa --platform android --message "Maya five reviewed modules on main v148 QA $(git rev-parse --short HEAD)" --non-interactive
