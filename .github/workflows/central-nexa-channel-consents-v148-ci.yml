name: Central Nexa channel consent V148 checks
on:
  pull_request:
    paths:
      - 'app/central-nexa.tsx'
      - 'scripts/validate-central-channel-consents-v148.js'
      - '.github/workflows/central-nexa-channel-consents-v148-ci.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard consent UI invariants
        run: node scripts/validate-central-channel-consents-v148.js
