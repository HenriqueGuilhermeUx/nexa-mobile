name: Nexa Pay Pilot APK

on:
  push:
    branches:
      - prep/nexa-pay-us-receiving-disabled
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_NEXA_API_URL: "https://nexa-backend-p2u0.onrender.com/api/v1"
      EXPO_PUBLIC_NEXA_PAY_API_URL: "https://nexa-open-finance-homolog.onrender.com/api/v1"
      EXPO_PUBLIC_NEXA_PAY_ENABLED: "true"
      EXPO_PUBLIC_NEXA_PAY_QR_ENABLED: "false"
      EXPO_PUBLIC_NEXA_PAY_WALLET_EXECUTION_ENABLED: "false"
      EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED: "false"
      EXPO_PUBLIC_NEXA_ASSISTANT_ENABLED: "true"
      EXPO_PUBLIC_NEXA_RELEASE_CHANNEL: "nexa-pay-pilot"

    steps:
      - name: Checkout pilot branch
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk dist-apk/Nexa-Pay-Pilot.apk
          sha256sum dist-apk/Nexa-Pay-Pilot.apk > dist-apk/Nexa-Pay-Pilot.sha256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexa-pay-pilot-apk
          path: |
            dist-apk/Nexa-Pay-Pilot.apk
            dist-apk/Nexa-Pay-Pilot.sha256.txt
          if-no-files-found: error
          retention-days: 14
