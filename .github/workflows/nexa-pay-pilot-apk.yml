name: Nexa Pay Pilot APK

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
    paths:
      - '.nexa-pay-apk-trigger'
      - 'app/**'
      - 'src/**'
      - 'nexa-mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'app.config.js'
      - 'eas.json'
      - 'entrypoint.js'
      - 'babel.config.js'
      - 'tsconfig.json'
  workflow_dispatch:

jobs:
  build-apk:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'prep/nexa-pay-us-receiving-disabled'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_NEXA_API_URL: 'https://nexa-backend-p2u0.onrender.com/api/v1'
      EXPO_PUBLIC_NEXA_PAY_API_URL: 'https://nexa-open-finance-homolog.onrender.com/api/v1'
      EXPO_PUBLIC_NEXA_PAY_ENABLED: 'true'
      EXPO_PUBLIC_NEXA_PAY_QR_ENABLED: 'false'
      EXPO_PUBLIC_NEXA_PAY_WALLET_EXECUTION_ENABLED: 'false'
      EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED: 'false'
      EXPO_PUBLIC_NEXA_ASSISTANT_ENABLED: 'true'
      EXPO_PUBLIC_NEXA_RELEASE_CHANNEL: 'nexa-pay-pilot'

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android 36 toolchain
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Verify pilot safety flags
        run: |
          test "$EXPO_PUBLIC_NEXA_PAY_ENABLED" = "true"
          test "$EXPO_PUBLIC_NEXA_PAY_QR_ENABLED" = "false"
          test "$EXPO_PUBLIC_NEXA_PAY_WALLET_EXECUTION_ENABLED" = "false"
          test "$EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED" = "false"

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Build standalone APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare artifact
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk nexa-pay-pilot.apk
          sha256sum nexa-pay-pilot.apk > nexa-pay-pilot.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexa-pay-pilot-apk
          path: |
            nexa-pay-pilot.apk
            nexa-pay-pilot.sha256
          if-no-files-found: error
          retention-days: 14
