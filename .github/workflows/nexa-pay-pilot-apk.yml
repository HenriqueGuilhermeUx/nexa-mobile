name: Nexa Pay Pilot APK

on:
  push:
    branches:
      - prep/nexa-pay-us-receiving-disabled
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    if: github.event_name != 'pull_request' || github.head_ref == 'prep/nexa-pay-us-receiving-disabled'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      NODE_OPTIONS: "--max-old-space-size=6144"
      EXPO_PUBLIC_NEXA_API_URL: "https://nexa-backend-p2u0.onrender.com/api/v1"
      EXPO_PUBLIC_NEXA_PAY_API_URL: "https://nexa-open-finance-homolog.onrender.com/api/v1"
      EXPO_PUBLIC_NEXA_PAY_ENABLED: "true"
      EXPO_PUBLIC_NEXA_PAY_QR_ENABLED: "false"
      EXPO_PUBLIC_NEXA_PAY_WALLET_EXECUTION_ENABLED: "true"
      EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED: "false"
      EXPO_PUBLIC_NEXA_ASSISTANT_ENABLED: "true"
      EXPO_PUBLIC_NEXA_RELEASE_CHANNEL: "nexa-pay-pilot"

    steps:
      - name: Checkout pilot branch
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 toolchain
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Verify pilot safety envelope
        run: |
          test "$EXPO_PUBLIC_NEXA_PAY_ENABLED" = "true"
          test "$EXPO_PUBLIC_NEXA_PAY_WALLET_EXECUTION_ENABLED" = "true"
          test "$EXPO_PUBLIC_NEXA_PAY_QR_ENABLED" = "false"
          test "$EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED" = "false"

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-apk
          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist-apk/Nexa-Pay-Pilot-Blue.apk
          sha256sum dist-apk/Nexa-Pay-Pilot-Blue.apk > dist-apk/Nexa-Pay-Pilot-Blue.sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexa-pay-pilot-blue-apk
          path: |
            dist-apk/Nexa-Pay-Pilot-Blue.apk
            dist-apk/Nexa-Pay-Pilot-Blue.sha256.txt
          if-no-files-found: error
          retention-days: 14
