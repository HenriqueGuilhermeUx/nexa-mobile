name: Apply Pix Deposit Fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-app:
    if: contains(github.event.head_commit.message, 'Add one-time Pix deposit fix workflow') || contains(github.event.head_commit.message, 'Run Pix deposit fix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Pix deposit patch
        run: node scripts/apply-pix-deposit-fix.js

      - name: Commit patched App.js
        run: |
          if git diff --quiet App.js; then
            echo "No App.js changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.js
          git commit -m "Fix mobile Pix deposit QR handling"
          git push
