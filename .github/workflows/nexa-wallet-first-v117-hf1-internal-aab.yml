name: Nexa Wallet-First v117 HF1 Internal AAB

on:
  push:
    branches:
      - release/nexa-wallet-first-v117-hotfix-privy-internal
    paths:
      - '.github/workflows/nexa-wallet-first-v117-hf1-internal-aab.yml'
      - 'eas.json'
      - 'app.config.js'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'app/**'
      - 'src/**'
      - 'scripts/validate-biometric-app-lock.js'
      - 'scripts/validate-release-assets.js'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: nexa-wallet-first-v117-hf1-internal-aab
  cancel-in-progress: true

jobs:
  build:
    name: Signed Wallet-First v117 HF1 build 118 AAB
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          eas whoami

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Preflight production backend
        run: |
          set -euo pipefail
          API='https://nexa-backend-p2u0.onrender.com/api/v1'
          curl --fail --silent --show-error --retry 8 --retry-delay 10 --max-time 20 "$API/health" -o prod-health.json
          node -e "const h=require('./prod-health.json'); if(String(h.status||'').toLowerCase()!=='ok') process.exit(1);"

      - name: Assert hotfix identity and Privy ownership recovery
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8')).expo;
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          const p = eas?.build?.['production-open-finance-aab'];
          const ownership = fs.readFileSync('app/wallet-ownership.tsx', 'utf8');
          const legacy = fs.readFileSync('app/legacy.js', 'utf8');
          const openFinance = fs.readFileSync('app/open-finance.tsx', 'utf8');

          if (app.name !== 'Nexa') throw new Error('Unexpected app name');
          if (app.android?.package !== 'br.com.trynexa.app') throw new Error('Unexpected Android package');
          if (app.version !== '2.0.20') throw new Error(`Unexpected version ${app.version}`);
          if (Number(app.android?.versionCode) !== 118) throw new Error(`Unexpected versionCode ${app.android?.versionCode}`);
          if (String(app.ios?.buildNumber) !== '118') throw new Error('Build identity mismatch');
          if (app.extra?.financialExecutionEnabled !== false) throw new Error('Financial execution must remain OFF');
          if (app.extra?.balanceSource !== 'ledger') throw new Error('Legacy balance source must remain ledger');
          if (!p || p.android?.buildType !== 'app-bundle') throw new Error('AAB build profile missing');
          if (p.env?.EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED !== 'false') throw new Error('Execution flag must remain OFF');

          for (const needle of [
            'useLoginWithEmail',
            'sendCode',
            'loginWithCode',
            "method: 'personal_sign'",
            'auditWallet',
            'verifyOwnershipSignature',
            'Ativar assinatura neste aparelho',
          ]) {
            if (!ownership.includes(needle)) throw new Error(`Ownership hotfix missing: ${needle}`);
          }
          if (/eth_sendTransaction|sendTransaction|transfer\(/.test(ownership)) throw new Error('Ownership screen must not execute transactions');
          if (!legacy.includes("router.push('/wallet-ownership')")) throw new Error('Ownership CTA missing from app');
          if (/bankList:\s*\{[^}]*maxHeight\s*:\s*320/.test(openFinance)) throw new Error('Open Finance overlap regression detected');
          if (!openFinance.includes('participants.slice(0, 8)')) throw new Error('Open Finance list guard missing');

          console.log('v117 HF1 build 118 identity + Privy session restore checks OK.');
          NODE

      - name: Validate release contracts
        run: |
          set -euo pipefail
          node scripts/validate-biometric-app-lock.js
          node scripts/validate-release-assets.js
          npm run typecheck
          npx expo-doctor

      - name: Validate generated Expo identity
        env:
          EXPO_PUBLIC_NEXA_API_URL: 'https://nexa-backend-p2u0.onrender.com/api/v1'
          EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_API_URL: 'https://nexa-backend-p2u0.onrender.com/api/v1'
          EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED: 'false'
          EXPO_PUBLIC_NEXA_ASSISTANT_ENABLED: 'true'
          EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_ENABLED: 'true'
          EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_RECURRING_ENABLED: 'false'
          EXPO_PUBLIC_NEXA_RELEASE_CHANNEL: 'wallet-first-v117-hf1-internal'
        run: |
          set -euo pipefail
          npx expo config --type public --json > expo-public-config.json
          node <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('expo-public-config.json', 'utf8'));
          if (c.android?.package !== 'br.com.trynexa.app') throw new Error('Unexpected Android package');
          if (c.version !== '2.0.20') throw new Error(`Unexpected version ${c.version}`);
          if (Number(c.android?.versionCode) !== 118) throw new Error(`Unexpected versionCode ${c.android?.versionCode}`);
          console.log('Expo identity OK: Nexa 2.0.20 v117 HF1 / Android build 118.');
          NODE
          ! grep -R -q 'EFI_OPEN_FINANCE_CLIENT_SECRET\|EFI_OPEN_FINANCE_CERTIFICATE_BASE64\|EFI_OPEN_FINANCE_WEBHOOK_HMAC\|PRIVY_APP_SECRET\|FOXBIT_API_SECRET' app src

      - name: Export Android JavaScript bundle
        env:
          CI: 'true'
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_NEXA_API_URL: 'https://nexa-backend-p2u0.onrender.com/api/v1'
          EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_API_URL: 'https://nexa-backend-p2u0.onrender.com/api/v1'
          EXPO_PUBLIC_NEXA_FINANCIAL_EXECUTION_ENABLED: 'false'
          EXPO_PUBLIC_NEXA_ASSISTANT_ENABLED: 'true'
          EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_ENABLED: 'true'
          EXPO_PUBLIC_NEXA_EFI_OPEN_FINANCE_RECURRING_ENABLED: 'false'
          EXPO_PUBLIC_NEXA_RELEASE_CHANNEL: 'wallet-first-v117-hf1-internal'
        run: npm run export:android

      - name: Build signed internal-test AAB
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: 'true'
          NODE_ENV: 'production'
          EXPO_NO_TELEMETRY: '1'
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
          EAS_LOCAL_BUILD_SKIP_CLEANUP: '1'
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/nexa-wallet-first-v117-hf1
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/local-build-artifacts-v117-hf1
        run: |
          set -euo pipefail
          FILE='Nexa-2.0.20-v117-HF1-build118-Wallet-First-Internal.aab'
          rm -f "$FILE"
          eas build --platform android --profile production-open-finance-aab --local --non-interactive --output "$GITHUB_WORKSPACE/$FILE"
          test -s "$FILE"
          SHA256=$(sha256sum "$FILE" | awk '{print $1}')
          echo "aab_file=$FILE" >> "$GITHUB_ENV"
          echo "aab_sha256=$SHA256" >> "$GITHUB_ENV"

      - name: Verify AAB signature and archive structure
        run: |
          set -euo pipefail
          jarsigner -verify -verbose -certs "${{ env.aab_file }}" > aab-signature.txt
          grep -q 'jar verified' aab-signature.txt
          unzip -l "${{ env.aab_file }}" > aab-contents.txt
          grep -q 'base/manifest/AndroidManifest.xml' aab-contents.txt
          grep -q 'base/dex/classes.dex' aab-contents.txt
          printf '%s  %s\n' "${{ env.aab_sha256 }}" "${{ env.aab_file }}" > SHA256SUMS.txt

      - name: Upload verified v117 HF1 internal AAB
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-Wallet-First-v117-HF1-build118-Internal-AAB-VERIFIED
          path: |
            ${{ env.aab_file }}
            SHA256SUMS.txt
            aab-signature.txt
            aab-contents.txt
            expo-public-config.json
          if-no-files-found: error
          retention-days: 30
