name: Nexa iOS certificate check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-26
    env:
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - name: Read Apple public certificate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user 'PyJWT[crypto]'
          python3 - <<'PY'
          import os,time,jwt,json,base64,urllib.request,pathlib
          token=jwt.encode({'iss':os.environ['APPLE_API_ISSUER_ID'],'iat':int(time.time())-10,'exp':int(time.time())+300,'aud':'appstoreconnect-v1'},os.environ['APPLE_API_KEY_P8'].replace('\\n','\n'),algorithm='ES256',headers={'kid':os.environ['APPLE_API_KEY_ID']})
          request=urllib.request.Request('https://api.appstoreconnect.apple.com/v1/certificates/9MS57C3J94',headers={'Authorization':'Bearer '+token})
          with urllib.request.urlopen(request,timeout=30) as response: obj=json.load(response)
          pathlib.Path('apple-public.cer').write_bytes(base64.b64decode(obj['data']['attributes']['certificateContent']))
          print('Apple certificate type:',obj['data']['attributes']['certificateType'])
          PY
          openssl x509 -inform DER -in apple-public.cer -pubkey -noout | openssl pkey -pubin -outform DER | shasum -a 256
      - name: Upload public certificate
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-Apple-public-certificate
          path: apple-public.cer
          if-no-files-found: error
