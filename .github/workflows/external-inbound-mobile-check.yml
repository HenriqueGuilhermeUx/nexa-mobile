name: External USDC inbound mobile typecheck
on:
  push:
    branches:
      - feat/walletconnect-inbound-br-global-v1
    paths:
      - 'package.json'
      - 'app.json'
      - 'eas.json'
      - 'scripts/check-wallet-inbound-config.cjs'
      - 'babel.config.js'
      - 'src/lib/externalUsdcInboundPreview.ts'
      - 'src/lib/directUsdcReceive.ts'
      - 'src/lib/directUsdcReceipt.ts'
      - 'src/lib/externalWalletOwnership.ts'
      - 'src/lib/externalWalletUsdcBalance.ts'
      - 'src/lib/externalWalletProviderProof.ts'
      - 'src/lib/activeExternalWalletAccount.ts'
      - 'src/lib/externalWalletConnector.ts'
      - 'src/lib/externalWalletConnectionState.ts'
      - 'src/lib/reownConnectedWalletBridge.ts'
      - 'src/lib/reownExternalWalletAppKit.ts'
      - 'src/lib/externalWalletReownGate.ts'
      - 'src/components/ExternalWalletProofPanel.tsx'
      - 'src/components/StagedExternalWalletConnect.tsx'
      - 'src/components/ExternalUsdcInboundPreviewPanel.tsx'
      - 'src/components/DirectUsdcReceivePanel.tsx'
      - 'app/(app)/external-usdc-preview.tsx'
      - 'app/(app)/receive-usdc.tsx'
      - 'app/(app)/external-wallet-connect.tsx'
      - 'app/(app)/wallet-inbound-lab.tsx'
      - '.github/workflows/external-inbound-mobile-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install without writing lockfile
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Preflight app identifiers and Reown staging gates
        run: node scripts/check-wallet-inbound-config.cjs
      - name: Typecheck
        run: npm run typecheck
